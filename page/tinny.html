<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tinny</title>
<style>
@font-face { font-family: "Andika"; src: url("/fonts/andika-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #16181f; touch-action: none; -webkit-user-select: none; user-select: none; cursor: none; }
body { display: grid; place-items: center; }
/* Drawn at the little screen's own 480x320 and scaled to fit anything else. */
canvas { display: block; width: min(100vw, 150vh); height: min(66.667vw, 100vh); image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="480" height="320"></canvas>
<script src="/render.js"></script>
<script>
// Tinny: a little tin-can pet for the 3.5" touchscreen. Its mood comes from the
// house: a new postcard, her calendar, the weather, bedtime, hugs from the
// admin page, and a gentle "call Grandpa?" now and then. Zelda can also play
// with it: four learning games that find her level by themselves (letters,
// reading, spelling, numbers), feeding, a bath, ball and peekaboo, dress-up,
// and getting it ready for bed. Right answers water her garden. Holidays bring
// costumes. Nothing ever goes wrong for Tinny: it only gets a bit hungry or
// dusty and asks. Every tap shows a ring where it landed; the targets are big,
// and a grown-up can recalibrate the touch from the admin page.
const PB = window.PhoneBook;
const W = 480, H = 320, FPS = 8;
const c = document.getElementById("c"), ctx = c.getContext("2d");
const COL = { k: "#16181f", g: "#b9c0cc", l: "#e4e8ef", d: "#8b93a3", w: "#ffffff", p: "#f2a1a8", m: "#e9ad1c", r: "#e2413b",
              b: "#2f6fb5", y: "#ffd84a", o: "#ef7f2c", t: "#46bfc0", v: "#b768d6", s: "#5fae4a" };
const NUDGE_EVERY_MIN = 30, NUDGE_FOR_MIN = 1;   // a "call someone?" minute every half hour
const MORNING_MIN = 20;                          // "good morning" for the first 20 minutes
const HUG_SECONDS = 20;
const PLAY_IDLE_S = 25;                          // a game she walks away from ends after this
const LEARN_IDLE_S = 60;                         // reading takes longer: a learning round waits a minute
const WIND_DOWN_MIN = 20;                        // the bedtime routine, before her big screen turns off

let doc = null, cards = [], seenTs = 0, hug = {}, weather = null, version = null;
let hearts = [], wiggleUntil = 0, nudgeDismissed = -1, tick = 0;
const images = {}, photos = {};
let hugShown = 0;
try { hugShown = +localStorage.getItem("tinny-hug") || 0; } catch (e) {}
// What Tinny remembers on this screen: when it last ate and had a bath, the stars
// Zelda has won, what she dressed it in, and the night she put it to bed.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const care = store.get("tinny-care", { fed: 0, bathed: 0 });
let stars = store.get("tinny-stars", 0), dress = store.get("tinny-dress", null), tuckedIn = store.get("tinny-tucked", "");
let palPet = 0, openedAt = 0;
let act = null, lastTap = 0, zones = [], confetti = [], said = null, taps = [], rings = [], lastDown = 0;

/* ---------------- data ---------------- */
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function refresh() {
  try {
    const v = await getJSON("/api/version");
    if (version && v.boot !== version.boot) return location.reload();   // the Pi was updated
    if (!version || v.version !== version.version) {
      [doc, cards] = await Promise.all([getJSON("/api/contacts"), getJSON("/api/postcards")]);
      version = v;
      // "Flip the little screen" on the admin page. Not on a preview from a phone.
      const preview = new URLSearchParams(location.hash.slice(1)).has("preview");
      c.style.transform = doc.screen?.littleFlip && !preview ? "rotate(180deg)" : "";
      for (const t of doc.tiles || []) if (t.kind === "photo" && t.photo && !photos[t.photo]) loadImg("/photos/" + encodeURIComponent(t.photo), (img) => (photos[t.photo] = img));
      if (cards[0]?.photo) loadImg(`/postcards/${cards[0].id}.jpg`);
      if (!weather && doc.tinny?.lat != null) getWeather();
      applyLevelSet();
    }
    const t = await getJSON("/api/tinny");
    seenTs = t.seen || 0; hug = t.hug || {};
    if (t.calibrate && t.calibrate > calTs) { calTs = t.calibrate; store.set("tinny-cal-ts", calTs); startCalibration(); }
  } catch (e) { /* the Pi is busy or restarting: try again soon */ }
}
function loadImg(src, done) {
  if (images[src]) return images[src];
  const img = new Image();
  img.onload = () => { images[src] = img; done && done(img); };
  img.src = src;
}
// Open-Meteo: free, no key. Asked from this browser every 20 minutes.
async function getWeather() {
  const t = doc?.tinny;
  if (!t || t.lat == null) { weather = null; return; }
  const f = t.units !== "C";
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${t.lat}&longitude=${t.lon}&current=temperature_2m,weather_code` +
    `&hourly=precipitation_probability,weather_code&forecast_hours=3&timezone=auto${f ? "&temperature_unit=fahrenheit" : ""}`;
  try {
    const w = await getJSON(url);
    const code = w.current.weather_code, temp = Math.round(w.current.temperature_2m);
    const soon = (w.hourly?.weather_code || []).slice(0, 3), prob = Math.max(0, ...(w.hourly?.precipitation_probability || []).slice(0, 3));
    const wet = (k) => (k >= 51 && k <= 67) || (k >= 80 && k <= 82) || k >= 95;
    const snowy = (k) => (k >= 71 && k <= 77) || k === 85 || k === 86;
    const tf = f ? temp : temp * 9 / 5 + 32;
    weather = {
      temp, unit: f ? "°" : "°C", code,
      rain: wet(code) || (soon.some(wet) && prob >= 50),
      snow: snowy(code) || soon.some(snowy),
      cold: tf <= 42, hot: tf >= 85,
      icon: snowy(code) ? "❄️" : wet(code) ? "🌧️" : code >= 45 && code <= 48 ? "🌫️" : code >= 2 ? "⛅" : "☀️",
    };
  } catch (e) { /* no internet: Tinny just skips the weather */ }
}

/* ---------------- what's going on ---------------- */
const hm = (d) => d.getHours() * 60 + d.getMinutes();
const toMin = (s) => { const [h, m] = (s || "0:0").split(":").map(Number); return h * 60 + m; };
function asleep(now) {   // asleep whenever her big screen is off
  const on = toMin(doc?.screen?.on || "08:00"), off = toMin(doc?.screen?.off || "20:00"), m = hm(now);
  if (on === off) return false;
  return on < off ? !(m >= on && m < off) : !(m >= on || m < off);
}
function nowTiles(now) {
  if (!doc) return [];
  const tiles = Object.fromEntries((doc.tiles || []).map(t => [t.id, t]));
  return ((doc.week?.[PB.weekdayOf(now)] || [])[PB.periodAt(now)] || []).map(id => tiles[id]).filter(Boolean);
}
function newCard() { return cards.find(c => c.ts > seenTs) && cards[0]; }
function weeksOld(now) {
  let born = doc?.tinny?.born;
  try { born = born || +localStorage.getItem("tinny-born") || 0; if (!born) { born = Math.floor(now / 1000); localStorage.setItem("tinny-born", born); } } catch (e) { born = born || now / 1000; }
  return Math.max(1, Math.floor((now / 1000 - born) / 604800) + 1);
}
// Someone to call: the people she hasn't heard from (by postcard) the longest.
function nudgeFor(now) {
  const m = hm(now);
  const slot = Math.floor(m / NUDGE_EVERY_MIN);
  if (m % NUDGE_EVERY_MIN >= NUDGE_FOR_MIN || slot === nudgeDismissed || m < toMin(doc?.screen?.on) + MORNING_MIN) return null;
  const callable = (doc?.people || []).filter(p => p.pad || p.code);
  if (!callable.length) return null;
  const heard = (p) => Math.max(0, ...cards.filter(c => c.from === p.name || c.from.includes(p.name)).map(c => c.ts));
  const ranked = callable.map(p => ({ p, last: heard(p) })).sort((a, b) => a.last - b.last).slice(0, 3);
  const pick = ranked[slot % ranked.length];
  return { person: pick.p, slot, longAgo: now / 1000 - pick.last > 7 * 86400 };
}
function scene(now) {
  if (!doc) return "loading";
  if (calib) return "calibrate";
  if (doc.screen?.board === "off") return "off";
  if (asleep(now) || tuckedIn === dayKey(now)) return "bedtime";
  if (act && (Date.now() - lastTap) / 1000 > (act.kind === "learn" ? LEARN_IDLE_S : PLAY_IDLE_S) && act.kind !== "done") act = null;
  if (act) return "play";
  if (hug.ts && hug.ts > hugShown && now / 1000 - hug.ts < HUG_SECONDS) return "hug";
  if (newCard()) return "postcard";
  const since = hm(now) - toMin(doc.screen?.on || "08:00");
  if (since >= 0 && since < MORNING_MIN && !routineDone("morning", now)) return "morning";
  if (windingDown(now)) return "winddown";
  if (nudgeFor(now)) return "nudge";
  return "day";
}

/* ---------------- what Tinny wears ---------------- */
function outfit(tiles) {
  const words = tiles.map(t => (t.label + " " + (t.emoji || "")).toLowerCase()).join(" ");
  const has = (...ks) => ks.some(k => words.includes(k));
  const o = {};
  if (has("swim", "pool", "🏊")) o.goggles = true;
  if (has("school", "🎒", "class")) o.backpack = true;
  if (has("bike", "🚲", "scooter")) o.hat = "helmet";
  else if (has("special", "party", "birthday", "⭐", "🎉", "🎂")) o.hat = "party";
  else if (has("art", "🎨", "paint", "draw")) o.hat = "beret";
  else if (has("dance", "💃", "ballet")) o.hat = "bow";
  if (has("bed", "🌙", "sleep")) o.hat = o.hat || "nightcap";
  if (weather?.hot && !o.goggles) o.shades = true;
  if (weather?.cold) o.scarf = true;
  if (weather?.rain) { o.umbrella = true; if (o.hat === "helmet") delete o.hat; }
  if (weather?.snow && !o.hat) o.snowcap = true;
  const hol = holiday(new Date());
  if (hol && !o.umbrella && o.hat !== "helmet") { o.hat = hol.hat; delete o.snowcap; }
  const pick = dressNow();
  if (pick) {
    delete o.snowcap;
    if (pick === "specs") o.specs = true;
    else if (pick === "shades") o.shades = true;
    else if (!o.umbrella) o.hat = pick;
  }
  return o;
}

/* ---------------- drawing ---------------- */
function rect(x, y, w, h, col) { ctx.fillStyle = COL[col] || col; ctx.fillRect(x, y, w, h); }
function sky(top, bottom) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function ground(col, tuft) { rect(0, 266, W, 54, col); if (tuft) for (let x = 0; x < W; x += 28) rect(x, 266, 14, 6, tuft); }
function text(s, x, y, size, col = "#16181f", align = "left") {
  ctx.font = `700 ${size}px Andika, "Noto Color Emoji", sans-serif`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y);
}
function fit(s, size, maxW) { ctx.font = `700 ${size}px Andika`; while (size > 12 && ctx.measureText(s).width > maxW) { size--; ctx.font = `700 ${size}px Andika`; } return size; }
function pill(x, y, w, h, label, size = 19, bg = "#16181f", fg = "#fff") {
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  text(label, x + w / 2, y + h / 2 + size * 0.36, size, fg, "center");
}
function bubble(x, y, w, h, lines, size, tailX) {
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#16181f"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tailX, y + h - 2); ctx.lineTo(tailX - 16, y + h + 22); ctx.lineTo(tailX + 18, y + h - 2); ctx.fill(); ctx.stroke();
  rect(tailX + 2, y + h - 6, 14, 6, "w");
  const sz = Math.min(size, ...lines.map(l => fit(l, size, w - 32)));
  lines.forEach((l, i) => text(l, x + 16, y + h / 2 + (i - (lines.length - 1) / 2) * (sz + 6) + sz * 0.36, sz));
}
const HEART = [".xx.xx.", "xxxxxxx", "xxxxxxx", ".xxxxx.", "..xxx..", "...x..."];
function heart(x, y, u, col) { ctx.fillStyle = col; HEART.forEach((r, j) => [...r].forEach((ch, i) => ch === "x" && ctx.fillRect(x + i * u, y + j * u, u, u))); }
function sparkle(x, y, u, col = "#e9ad1c") { rect(x + u, y, u, 3 * u, col); rect(x, y + u, 3 * u, u, col); }

// Tinny itself, on a grid of u-pixel squares. 26 wide, about 27 tall.
function tinny(ox, oy, u, o = {}) {
  const px = (x, y, col, w = 1, h = 1) => rect(ox + x * u, oy + y * u, w * u, h * u, col);
  const sq = o.squish ? 1 : 0, top = 5 + sq, bot = 24;
  if (o.umbrella) {   // held in its right hand, canopy over its head
    px(22, top - 4, "k", 1, bot - top);
    px(13, top - 5, "r", 18, 1); px(15, top - 6, "r", 14, 1); px(18, top - 7, "r", 8, 1);
    for (let i = 0; i < 3; i++) px(15 + i * 6, top - 5, "w", 2, 1);
  }
  if (o.backpack) { px(1, top + 6, "k", 4, 11); px(2, top + 7, "r", 2, 9); }
  if (!o.hat && !o.cap && !o.umbrella) { px(13, 1 + sq, "k", 1, top - 1 - sq); px(12, sq, "m", 3, 2); px(12, sq, "k"); }
  // the can
  px(5, top, "k", 16, 1); px(4, top + 1, "k", 1, bot - top - 1); px(21, top + 1, "k", 1, bot - top - 1); px(5, bot, "k", 16, 1);
  px(5, top + 1, "g", 16, bot - top - 1);
  px(5, top + 1, "l", 16, 2); px(5, top + 3, "d", 16, 1); px(5, bot - 3, "d", 16, 1);
  px(6, top + 5, "l", 1, bot - top - 9); px(7, top + 5, "l", 1, 2);
  if (o.pj) for (let y = top + 15; y < bot - 1; y += 2) px(5, y, "#9fc3ea", 16, 1);
  if (o.dirt) for (const [x, y] of [[8, 4], [17, 5], [10, 15], [16, 16], [13, 18], [7, 12]]) px(x, top + y, "#8a6a45");
  if (o.snowcap) { px(5, top - 1, "w", 16, 2); px(7, top - 2, "w", 5, 1); px(14, top - 2, "w", 4, 1); }
  if (o.backpack) { px(6, top + 4, "r", 1, 15); px(19, top + 4, "r", 1, 15); }
  // face
  const ey = top + 7;
  if (o.eyes === "closed" || o.blink) { px(8, ey + 1, "k", 3, 1); px(15, ey + 1, "k", 3, 1); }
  else if (o.eyes === "happy") { px(8, ey + 1, "k"); px(9, ey, "k"); px(10, ey + 1, "k"); px(15, ey + 1, "k"); px(16, ey, "k"); px(17, ey + 1, "k"); }
  else if (o.eyes === "sad") { px(8, ey, "k"); px(9, ey, "k", 2, 3); px(9, ey, "w"); px(15, ey, "k", 2, 3); px(17, ey, "k"); px(15, ey, "w"); }
  else { px(9, ey, "k", 2, 3); px(9, ey, "w"); px(15, ey, "k", 2, 3); px(15, ey, "w"); }
  if (o.goggles) { px(5, ey, "t", 16, 1); px(7, ey - 1, "k", 6, 5); px(14, ey - 1, "k", 6, 5); px(8, ey, "t", 4, 3); px(15, ey, "t", 4, 3); px(9, ey, "w"); px(16, ey, "w"); }
  if (o.shades) { px(7, ey - 1, "k", 5, 4); px(14, ey - 1, "k", 5, 4); px(12, ey, "k", 2, 1); px(8, ey, "d"); px(15, ey, "d"); }
  if (o.specs) { for (const x of [7, 14]) { px(x, ey - 1, "k", 5, 1); px(x, ey + 3, "k", 5, 1); px(x, ey - 1, "k", 1, 5); px(x + 4, ey - 1, "k", 1, 5); } px(12, ey, "k", 2, 1); }
  px(7, ey + 3, "p", 2, 1); px(17, ey + 3, "p", 2, 1);
  const my = ey + 4;
  if (o.mouth === "open") { px(12, my, "k", 3, 1); px(12, my + 1, "r", 3, 1); px(13, my + 2, "k"); px(11, my, "k", 1, 2); px(15, my, "k", 1, 2); }
  else if (o.mouth === "flat") px(12, my + 1, "k", 3, 1);
  else if (o.mouth === "o") px(12, my, "k", 2, 2);
  else { px(11, my, "k"); px(12, my + 1, "k", 3, 1); px(15, my, "k"); }
  if (o.foam) { px(10, my - 1, "w", 7, 1); px(11, my + 2, "w", 5, 1); px(9, my + 1, "w"); px(17, my, "w"); }
  if (o.scarf) { px(4, my + 3, "r", 18, 2); px(6, my + 3, "w", 2, 2); px(12, my + 3, "w", 2, 2); px(18, my + 3, "w", 2, 2); px(17, my + 5, "r", 3, 4); }
  // arms
  if (o.arms === "up") { px(2, top + 2, "k", 2, 6); px(22, top + 2, "k", 2, 6); }
  else if (o.arms === "hug") { px(2, top + 9, "k", 2, 3); px(22, top + 9, "k", 2, 3); px(6, top + 12, "k", 4, 2); px(16, top + 12, "k", 4, 2); }
  else if (o.arms === "phone") { px(2, top + 11, "k", 2, 3); px(22, top + 8, "k", 2, 2); px(23, top + 6, "k", 2, 2); }
  else { px(2, top + 10, "k", 2, 4); if (o.umbrella) px(22, top + 9, "k", 2, 2); else px(22, top + 10, "k", 2, 4); }
  px(7, bot + 1, "k", 4, 2); px(15, bot + 1, "k", 4, 2);
  // hats
  const hat = o.cap ? "nightcap" : o.hat;
  if (hat === "nightcap") { px(6, top - 3, "b", 14, 3); px(9, top - 5, "b", 8, 2); px(13, top - 7, "b", 4, 2); px(17, top - 7, "w", 3, 3); px(5, top - 1, "w", 16, 1); }
  if (hat === "helmet") { px(5, top - 4, "k", 16, 5); px(6, top - 3, "o", 14, 3); px(8, top - 3, "w", 2, 1); px(4, top, "k", 18, 1); }
  if (hat === "party") { px(10, top - 1, "v", 7, 1); px(11, top - 3, "v", 5, 2); px(12, top - 5, "y", 3, 2); px(13, top - 7, "v", 1, 2); px(12, top - 8, "y", 3, 1); px(11, top - 2, "y"); px(14, top - 4, "w"); }
  if (hat === "beret") { px(6, top - 2, "r", 14, 2); px(8, top - 3, "r", 10, 1); px(13, top - 4, "k", 1, 1); }
  if (hat === "bow") { px(14, top - 2, "p", 3, 3); px(18, top - 2, "p", 3, 3); px(17, top - 1, "r", 1, 1); }
  if (hat === "crown") { px(7, top - 3, "y", 12, 3); for (const x of [7, 12, 17]) px(x, top - 5, "y", 2, 2); px(12, top - 2, "r", 2, 1); px(8, top - 2, "b"); px(17, top - 2, "s"); }
  if (hat === "flower") { px(16, top - 4, "p", 5, 1); px(17, top - 5, "p", 3, 3); px(16, top - 3, "p", 5, 1); px(18, top - 4, "y"); px(17, top - 1, "s", 1, 2); }
  // holiday hats
  if (hat === "santa") { px(6, top - 3, "r", 14, 3); px(9, top - 5, "r", 8, 2); px(13, top - 7, "r", 5, 2); px(17, top - 8, "w", 3, 3); px(5, top - 1, "w", 16, 2); }
  if (hat === "pumpkin") { px(5, top - 5, "o", 16, 5); px(7, top - 6, "o", 12, 1); px(10, top - 6, "#c85f14", 1, 6); px(15, top - 6, "#c85f14", 1, 6); px(12, top - 8, "#5a8a2b", 2, 2); px(14, top - 8, "#5a8a2b", 2, 1); }
  if (hat === "pilgrim") { px(4, top - 1, "k", 18, 1); px(8, top - 6, "k", 10, 5); px(11, top - 4, "y", 4, 3); px(12, top - 3, "k", 2, 1); }
  if (hat === "heart") { px(13, top - 3, "k", 1, 3); px(11, top - 7, "r", 2, 1); px(14, top - 7, "r", 2, 1); px(11, top - 6, "r", 5, 1); px(12, top - 5, "r", 3, 1); px(13, top - 4, "r", 1, 1); }
  if (hat === "lucky") { px(4, top - 1, "#2e8b3a", 18, 1); px(8, top - 7, "#2e8b3a", 10, 6); px(8, top - 3, "k", 10, 1); px(12, top - 3, "y", 2, 1); }
  if (hat === "bunny") { for (const x of [7, 14]) { px(x, top - 10, "k", 5, 10); px(x + 1, top - 9, "w", 3, 9); px(x + 2, top - 8, "p", 1, 7); } }
  if (hat === "uncle") { px(4, top - 1, "b", 18, 1); px(8, top - 7, "w", 10, 6); for (const y of [7, 5, 3]) px(8, top - y, "r", 10, 1); px(8, top - 2, "b", 10, 1); }
  if (hat === "cowboy") { px(4, top - 1, "#8a5a2b", 18, 1); px(7, top - 4, "#8a5a2b", 12, 3); px(8, top - 5, "#8a5a2b", 3, 1); px(15, top - 5, "#8a5a2b", 3, 1); px(7, top - 2, "y", 12, 1); }
}

// A tile from her calendar, framed like a magnet, for Tinny to "hold up".
function tileCard(t, x, y, s) {
  ctx.fillStyle = "#16181f"; ctx.beginPath(); ctx.roundRect(x - 3, y - 3, s + 6, s + 10, 14); ctx.fill();
  PB.drawTile(ctx, t, x, y, s, photos);
}

/* ---------------- the scenes ---------------- */
function drawDay(now, o, u, bob) {
  const p = PB.periodAt(now);
  const wet = weather?.rain, snow = weather?.snow;
  if (wet) sky("#9aa6b6", "#cfd6df");
  else if (p === 0) sky("#ffd7b0", "#fdf0dc");
  else if (p === 1) sky("#bfe3f5", "#e8f5fb");
  else sky("#b49ad8", "#f6c7a6");
  ground(snow ? "#f3f6fb" : p === 2 ? "#7aa65a" : "#8fcf6a", snow ? "#dfe6f1" : "#7cbd58");
  if (wet) for (let i = 0; i < 26; i++) { const x = (i * 53 + tick * 9) % W, y = (i * 37 + tick * 22) % 260; rect(x, y, 2, 10, "#5f7a9a"); }
  if (snow) for (let i = 0; i < 22; i++) { const x = (i * 61 + tick * 3 + Math.sin(tick / 3 + i) * 6) % W, y = (i * 29 + tick * 6) % 262; rect(x, y, 4, 4, "#fff"); }
  if (weather?.cold && tick % 16 < 8) { ctx.globalAlpha = 0.6; rect(52 + 12 * u, 120 + bob - tick % 8 * 3, 10, 8, "#fff"); ctx.globalAlpha = 1; }
  const tiles = nowTiles(now);
  const ty = 266 - 27 * u + bob, want = wants(now);
  tinny(40, ty, u, { ...o, ...outfit(tiles), dirt: dusty(now) });
  zone(0, 0, W, H, openMenu);                         // anywhere else: the play menu
  zone(40, ty + 8 * u, 26 * u, 19 * u, pet);
  zone(40, ty - 9 * u, 26 * u, 17 * u, nextDress);     // its head and hat: try on the next one
  if (want && !said) thought(40 + 21 * u, ty - 2 * u, want === "eat" ? "🍎" : "🫧");
  const hol = holiday(now);
  if (hol) hol.decor.forEach((d, i) => text(d, [300, 330, 460][i], 262 + (tick % 8 < 4 && i === 1 ? -3 : 0), 24, "#000", "center"));   // sitting on the ground
  // What's happening now, on the right.
  pill(270, 26, 186, 34, PB.PERIODS[p] + (tiles.length ? "" : ""), 18, PB.DAY_COLORS[PB.weekdayOf(now)]);
  // what's on now: just the pictures, big (no names: she knows them by sight)
  if (tiles[0]) tileCard(tiles[0], 290, 74, 144);
  else { ctx.fillStyle = "#ffffffaa"; ctx.beginPath(); ctx.roundRect(290, 74, 144, 144, 18); ctx.fill(); text("😊", 362, 166, 64, "#000", "center"); }
  if (tiles[1]) tileCard(tiles[1], 396, 170, 70);
  const pal = friendOfDay(now);
  if (pal) {
    const fu = pal.kind === "cat" ? 4 : 3, fh = (pal.kind === "cat" ? 14 : 16) * fu, happy = ago(palPet) < 1.5;
    drawFriend(pal, 2, 264 - fh + (happy ? -5 : 0), fu, happy);
    zone(0, 262 - fh, 60, fh + 4, () => { palPet = Date.now(); say([pal.kind === "cat" ? `${pal.name} says` : `${pal.name} says`, pal.kind === "cat" ? "Meow! 🐱" : "Neigh! 🦄"], 1.8); hearts.push({ x: 20, y: 200, u: 4, col: "#e2413b", life: 12 }); });
  }
  drawEgg(250, 238, 46);
  if (eggReady() && tick % 8 < 4) text("!", 276, 214, 24, "#e2413b", "center");
  zone(222, 200, 58, 66, tapEgg);
  dayEvent(now, u, ty);
  playBar(now, want);
}

// Along the bottom, so she knows: a tap anywhere opens the play menu. Glows when Tinny wants something.
function playBar(now, want) {
  const glow = want && tick % 8 < 5;
  if (glow) { ctx.fillStyle = "#ffd84a"; ctx.beginPath(); ctx.roundRect(6, 268, 468, 50, 25); ctx.fill(); }
  pill(10, 272, 460, 42, want === "eat" ? "🍎  Tinny's hungry! Tap to play" : want === "bath" ? "🫧  Tinny's dusty! Tap to play" : "👆  Tap to play!   🍎 🛁 ⚽ 🎲", 20, "#16181f");
}

// The play menu: six big tiles, each with a picture and a word. The four
// learning games show her level; the one Tinny wants (food, a bath) glows.
function openMenu() { begin("menu"); }
function drawMenu(now) {
  rect(0, 0, W, H, "#16181f");
  const want = wants(now);
  homeButton(() => { act = null; });
  pill(300, 8, 172, 34, `⭐ ${stars}   🌷 ${garden.total}`, 18, "#2a2d3a");
  const tiles = [["🔤", "Letters", "P"], ["📖", "Read", "R"], ["✏️", "Spell", "S"], ["🔢", "Count", "M"], ["🍎", "Feed", "eat"], ["🎈", "Play", "play"]];
  const fills = ["#ffe3b8", "#cfeaf7", "#e7d4f5", "#c9ecb4", "#ffd0c8", "#fff1a8"];
  tiles.forEach(([e, label, key], i) => {
    const x = 6 + (i % 3) * 157, y = 50 + Math.floor(i / 3) * 136, w = 151, h = 130;
    const glow = ((key === "eat" && want === "eat") || (key === "play" && want === "bath")) && tick % 8 < 5;
    if (glow) { ctx.fillStyle = "#ffd84a"; ctx.beginPath(); ctx.roundRect(x - 4, y - 4, w + 8, h + 8, 24); ctx.fill(); }
    ctx.fillStyle = fills[i]; ctx.beginPath(); ctx.roundRect(x, y, w, h, 20); ctx.fill();
    text(e, x + w / 2, y + 70, 54, "#000", "center");
    text(label, x + w / 2, y + 112, 24, "#16181f", "center");
    if (TRACKS[key]) for (let l = 0; l < TRACKS[key].levels.length; l++) rect(x + 12 + l * 9, y + 10, 6, 6, l < learn[key].lv ? "#16181f" : "#16181f33");
    zone(x, y, w, h, () => (TRACKS[key] ? startLearn(key) : key === "eat" ? startEat() : startPlay(now)));
  });
}
// Play: whatever Tinny needs first (a bath), otherwise ball, colors and peekaboo in turn.
let nextPlay = store.get("tinny-play", 0);
function startPlay(now) {
  if (dusty(now)) return startBath();
  const k = ["ball", "color", "peek"][nextPlay % 3];
  nextPlay++; store.set("tinny-play", nextPlay);
  if (k === "ball") startBall(); else { begin(k, { round: 0 }); newRound(); }
}

function drawScene(now) {
  const name = scene(now);
  const weeks = weeksOld(now), u = weeks < 2 ? 6 : weeks < 6 ? 7 : 8;   // grows a little over the first weeks
  const bob = (tick % 8 < 4) ? 0 : 2;
  const blink = tick % 37 === 0 || tick % 37 === 1;
  const petting = Date.now() < wiggleUntil;
  const wig = petting ? (tick % 2 ? 4 : -4) : 0;
  ctx.save();
  zones = [];
  if (name === "off" || name === "loading") { rect(0, 0, W, H, "#000"); ctx.restore(); return; }
  if (name === "calibrate") { drawCalibration(); drawRings(); ctx.restore(); return; }

  if (name === "bedtime") {
    sky("#121a3a", "#283567"); ground("#1d2547");
    for (const [x, y, s] of [[40, 30, 2], [120, 70, 3], [220, 24, 2], [300, 90, 2], [430, 140, 3], [380, 40, 2], [70, 190, 2], [200, 140, 2]])
      rect(x, y, s * 2, s * 2, (tick + x) % 24 < 3 ? "#7d86b8" : "#fff6c8");
    const mn = moon(now);
    text(mn.e, 80, 118, 64, "#000", "center");
    text(`Tonight: ${mn.name}`, 80, 160, 14, "#c9d4ff", "center");
    ctx.globalAlpha = 0.85; tinny(120 + wig, 266 - 27 * u + 4, u, { eyes: "closed", mouth: "flat", cap: true, squish: tick % 16 < 8 }); ctx.globalAlpha = 1;
    const z = tick % 24;
    text("z", 296, 132 - (z % 8), 24, "#c9d4ff"); if (z >= 8) text("z", 318, 100 - (z % 8), 32, "#c9d4ff"); if (z >= 16) text("Z", 346, 62 - (z % 8), 42, "#c9d4ff");
    text("Goodnight, Zelda", 458, 302, 20, "#c9d4ff", "right");
  }

  else if (name === "postcard") {
    const card = newCard();
    sky("#bfe3f5", "#e8f5fb"); ground("#8fcf6a", "#7cbd58");
    const hop = tick % 6 < 3 ? -8 : 0;
    tinny(40 + wig, 100 + hop, 7, { eyes: "happy", mouth: "open", arms: "up" });
    rect(48, 34 + hop, 166, 98, "k"); rect(54, 40 + hop, 154, 86, "w"); rect(54, 40 + hop, 154, 8, "m");
    const img = card.photo && images[`/postcards/${card.id}.jpg`];
    if (img) {
      const bw = 150, bh = 74, s = Math.max(bw / img.naturalWidth, bh / img.naturalHeight);
      const sw = bw / s, sh = bh / s;
      ctx.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, 56, 50 + hop, bw, bh);
    } else if (card.caption) {
      text(card.caption, 131, 96 + hop, fit(card.caption, 22, 140), "#16181f", "center");
    } else heart(106, 64 + hop, 7, "#e2413b");
    if (tick % 4 < 2) { sparkle(30, 28, 6); sparkle(210, 128, 4); } else sparkle(222, 46, 5);
    const who = (card.from || "Someone").replace(/^from /i, "");
    const opened = ago(openedAt) < 15;
    bubble(250, 40, 210, 96, opened ? ["Look at your", "big screen! 📺"] : (who.length > 9 ? [who, "sent you something!"] : [who + " sent", "you something!"]), 23, 276);
    if (!opened && tick % 8 < 6) pill(256, 196, 200, 52, "👆  Tap to open it!", 21);
    if (!opened) zone(0, 0, W, H, () => {
      openedAt = Date.now(); burst(130, 80, 20);
      fetch("/api/tinny/open-postcards", { method: "POST" }).then(() => setTimeout(refresh, 3000)).catch(() => {});
    });
  }

  else if (name === "hug") {
    sky("#ffd6e0", "#fff0f3"); ground("#f4b9c8");
    tinny(150 + wig, 266 - 27 * u + 6, u, { eyes: "happy", mouth: "open", arms: "up", squish: tick % 4 < 2 });
    heart(150 + 13 * u - 35, 22 - (tick % 4) * 2, 10, "#e2413b");
    for (let i = 0; i < 5; i++) heart((60 + i * 88) % W, 230 - ((tick * 6 + i * 50) % 230), 4 + (i % 3), i % 2 ? "#f2a1a8" : "#e2413b");
    pill(110, 262, 260, 48, `Hug from ${hug.from || "someone"}!`, fit(`Hug from ${hug.from || "someone"}!`, 24, 230));
  }

  else if (name === "morning") drawRoutine("morning", now);

  else if (name === "nudge") {
    const n = nudgeFor(now), p = n.person;
    sky("#d9dde6", "#eef0f4"); ground("#c9c2b0");
    tinny(36 + wig, 266 - 27 * u + bob, u, { eyes: n.longAgo ? "sad" : undefined, mouth: n.longAgo ? "o" : "smile", arms: "phone" });
    // its own tin-can phone, with the string trailing off the screen
    const px = 36 + 23 * u, py = 266 - 27 * u + 9 * u + bob;
    rect(px, py, 30, 38, "k"); rect(px + 4, py + 4, 22, 30, "g"); rect(px + 4, py + 4, 22, 6, "l");
    ctx.strokeStyle = "#16181f"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px + 30, py + 26);
    ctx.bezierCurveTo(px + 90, py + 110 + Math.sin(tick / 2) * 8, 380, 120, 490, 180); ctx.stroke();
    bubble(214, 16, 246, 82, [`Call ${p.name}?`, n.longAgo ? "It's been a while!" : "Say hi!"], 22, 240);
    // the same card as in her phone book, so she knows which button
    ctx.fillStyle = "#fbf5e8"; ctx.strokeStyle = "#16181f"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(236, 176, 222, 82, 16); ctx.fill(); ctx.stroke();
    PB.drawPerson(ctx, p, { x: 248, y: 180, w: 200, h: 74 }, 74, photos);
  }

  else if (name === "play") {
    const k = act.kind;
    if (k === "menu") drawMenu(now);
    else if (k === "learn") drawLearn(now);
    else if (k === "hatch") drawHatch(now);
    else if (k === "friends") drawFriends(now);
    else if (k === "eat") drawEat(now, u); else if (k === "bath") drawBath(now, u); else if (k === "ball") drawBall(now, u);
    else if (k === "done") drawDone(now); else drawGame(now);
    if (act && !["done", "menu", "learn", "hatch", "friends"].includes(act.kind)) {          // home: back to the menu, any time
      ctx.fillStyle = "#16181f"; ctx.beginPath(); ctx.arc(28, 296, 20, 0, 7); ctx.fill(); text("🏠", 28, 304, 20, "#000", "center");
      zone(0, 266, 60, 54, () => { begin("menu"); });
    }
  }

  else if (name === "winddown") drawRoutine("evening", now);

  else drawDay(now, { blink, eyes: petting ? "happy" : undefined, mouth: petting ? "open" : undefined }, u, bob + 0);

  if (saying() && (name === "day" || name === "morning" || name === "winddown" || (name === "play" && act?.kind !== "learn" && act?.kind !== "menu" && act?.kind !== "done"))) bubble(214, 14, 250, 74, said.lines, 24, 240);
  if (name === "day" || name === "nudge") pill(14, 14, 92, 32, `⭐ ${stars}`, 17);
  if (weather && name === "day") pill(14, 52, 104, 32, `${weather.icon} ${weather.temp}${weather.unit}`, 17, "#ffffffcc", "#16181f");
  // hearts from petting float up and fade
  hearts = hearts.filter(h => h.life > 0);
  for (const h of hearts) { ctx.globalAlpha = Math.min(1, h.life / 6); heart(h.x, h.y, h.u, h.col); h.y -= 7; h.x += Math.sin(h.life) * 2; h.life--; }
  // where the screen thought she touched, for checking the touchscreen
  if (doc?.screen?.tapDots) for (const t of taps) if (ago(t.at) < 6) {
    ctx.strokeStyle = "#e2413b"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, 7); ctx.stroke();
    rect(t.x - 2, t.y - 2, 4, 4, "#e2413b"); text(`${Math.round(t.x)},${Math.round(t.y)}`, t.x + 16, t.y - 10, 14, "#e2413b");
  }
  drawRings();
  confetti = confetti.filter(p => p.life-- > 0);
  for (const p of confetti) { ctx.globalAlpha = Math.min(1, p.life / 6); rect(p.x, p.y, 7, 7, p.col); p.x += p.vx; p.y += p.vy; p.vy += 3; }
  ctx.globalAlpha = 1;
  ctx.restore();
}


/* ---------------- playing with Tinny ---------------- */
// Every frame lists its tap targets here; a tap goes to the last one it lands
// in, a little generously, since the touchscreen is rough. Anywhere else pets.
function zone(x, y, w, h, fn) { zones.push({ x, y, w, h, fn }); }
const SLOP = 8;
function hit(x, y) {
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i];
    if (x >= z.x - SLOP && x <= z.x + z.w + SLOP && y >= z.y - SLOP && y <= z.y + z.h + SLOP) return z.fn;
  }
  return null;
}
const pick3 = (list) => { const a = [...list].sort(() => Math.random() - 0.5); return a.slice(0, 3); };
const ago = (t) => (Date.now() - t) / 1000;
function dayKey(now) { return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`; }
function todayOn(now) { const d = new Date(now); const m = toMin(doc?.screen?.on || "08:00"); d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d.getTime(); }
// Hungry for breakfast each morning, and again four hours after a meal. Dusty ten hours after a bath.
const hungry = (now) => care.fed < todayOn(now) || now - care.fed > 4 * 3600e3;
const dusty = (now) => now - care.bathed > 10 * 3600e3;
const wants = (now) => hungry(now) ? "eat" : dusty(now) ? "bath" : null;
function windingDown(now) {
  if (!doc || doc.screen?.board === "off") return false;
  const off = toMin(doc.screen?.off || "20:00"), m = hm(now);
  const left = (off - m + 1440) % 1440;
  return left > 0 && left <= WIND_DOWN_MIN && !asleep(now);
}
function say(lines, secs = 2.5) { said = { lines, until: Date.now() + secs * 1000 }; }
function saying() { if (said && Date.now() > said.until) said = null; return said; }
function burst(x, y, n = 18) {
  const cols = ["#e2413b", "#ffd84a", "#46bfc0", "#b768d6", "#5fae4a", "#ef7f2c"];
  for (let i = 0; i < n; i++) confetti.push({ x, y, vx: (Math.random() - 0.5) * 22, vy: -8 - Math.random() * 14, col: cols[i % cols.length], life: 16 + Math.random() * 8 });
}
function thought(x, y, emoji) {
  const b = tick % 8 < 4 ? 0 : -3;
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#16181f"; ctx.lineWidth = 3;
  for (const [cx, cy, r] of [[x - 6, y + 34 + b, 5], [x + 4, y + 24 + b, 8]]) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); ctx.stroke(); }
  ctx.beginPath(); ctx.roundRect(x + 6, y - 30 + b, 56, 48, 22); ctx.fill(); ctx.stroke();
  text(emoji, x + 34, y + 6 + b, 28, "#000", "center");
}
function choiceCircle(cx, cy, r, fill, shake) {
  const dx = shake ? (tick % 2 ? 5 : -5) : 0;
  ctx.fillStyle = "#16181f"; ctx.beginPath(); ctx.arc(cx + dx, cy, r + 4, 0, 7); ctx.fill();
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(cx + dx, cy, r, 0, 7); ctx.fill();
  return dx;
}
function begin(kind, extra = {}) { act = { kind, t0: Date.now(), ...extra }; lastTap = Date.now(); said = null; }
function award() { stars++; store.set("tinny-stars", stars); }
function finish(lines = ["You did it!"]) { award(); warmEgg(1); begin("done", { lines, back: "menu" }); burst(240, 140, 30); }

// Dress up: each tap on its head tries the next thing, kept until the part of the day changes.
const WARDROBE = ["party", "crown", "beret", "bow", "flower", "cowboy", "helmet", "specs", "shades", null];
const WARDROBE_SAYS = { party: "Party!", crown: "A king!", beret: "Fancy!", bow: "So pretty!", flower: "A flower!", cowboy: "Yee-haw!", helmet: "Safe!", specs: "Smart!", shades: "Cool!" };
function dressNow() {
  if (!dress) return null;
  const now = new Date();
  if (dress.key !== dayKey(now) + PB.periodAt(now)) { dress = null; store.set("tinny-dress", null); return null; }
  return dress.pick;
}
function nextDress() {
  const now = new Date(), cur = dressNow();
  const pick = WARDROBE[(WARDROBE.indexOf(cur) + 1) % WARDROBE.length];
  dress = pick ? { pick, key: dayKey(now) + PB.periodAt(now) } : null;
  store.set("tinny-dress", dress);
  say([pick ? WARDROBE_SAYS[pick] : "Just me!"], 1.6);
  burst(40 + 13 * 8, 90, 8);
}

// Eat: three snacks to pick from; it munches, then would like one more.
const SNACKS = [["🍎", "apple"], ["🥕", "carrot"], ["🍌", "banana"], ["🧀", "cheese"], ["🍇", "grapes"], ["🍓", "berry"], ["🥦", "broccoli"],
                ["🍐", "pear"], ["🥞", "pancake"], ["🍪", "cookie"], ["🍕", "pizza"], ["🥒", "pickle"], ["🍉", "melon"], ["🥚", "egg"]];
function startEat() { begin("eat", { menu: pick3(SNACKS), eaten: 0, chew: null }); say(["I'm hungry!"]); }
function eat(snack, i) {
  if (!act) return;
  if (act.chew) return;
  act.chew = { snack, i, t: Date.now() };
  care.fed = Date.now(); store.set("tinny-care", care);
}
function drawEat(now, u) {
  sky("#ffe3b8", "#fff4e2"); ground("#d9b48a");
  rect(0, 228, W, 8, "#b8875a");                                            // a table edge
  const c = act.chew, t = c ? ago(c.t) : 0, chewing = c && t > 0.8 && t < 2.6;
  const ty = 266 - 27 * u;
  tinny(30, ty, u, { eyes: chewing ? "happy" : undefined, mouth: chewing ? (tick % 2 ? "open" : "flat") : c && t < 0.8 ? "open" : "smile", ...outfit(nowTiles(now)) });
  if (c && t < 0.8) {                                                       // the snack flies to its mouth
    const k = t / 0.8, sx = 260 + c.i * 76, mx = 30 + 13 * u, my = ty + 16 * u;
    text(c.snack[0], sx + (mx - sx) * k, 150 + (my - 150) * k - Math.sin(k * Math.PI) * 60, 52 - k * 24, "#000", "center");
  }
  if (chewing && tick % 2) for (let i = 0; i < 3; i++) rect(30 + 11 * u + i * 9, ty + 20 * u + (tick % 4) * 3, 5, 5, "#e9ad1c");
  if (c && t >= 2.6) {
    act.eaten++;
    const [, word] = c.snack;
    say(word === "broccoli" ? ["Broccoli!", "So strong!"] : word === "cookie" ? ["A cookie!", "What a treat!"] : ["Yum!", `I love ${word}!`], 2.2);
    for (let i = 0; i < 3; i++) hearts.push({ x: 60 + i * 50, y: ty, u: 5, col: "#e2413b", life: 14 });
    if (act.eaten >= 2) { finish(["I'm full!", "Thank you!"]); return; }
    act.menu = pick3(SNACKS); act.chew = null;
    setTimeout(() => act && act.kind === "eat" && !act.chew && say(["One more?"]), 2300);
  }
  if (!c) act.menu.forEach((sn, i) => {
    const x = 222 + i * 86;
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#16181f"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(x + 38, 196, 40, 14, 0, 0, 7); ctx.fill(); ctx.stroke();  // a plate
    text(sn[0], x + 38, 186, 56, "#000", "center");
    text(sn[1], x + 38, 254, fit(sn[1], 20, 84), "#16181f", "center");
    zone(x - 3, 100, 86, 180, () => eat(sn, i));
  });
}

// Bath: every tap scrubs and makes bubbles; six and it's squeaky clean.
function startBath() { begin("bath", { scrubs: 0, bubbles: [] }); say(["Scrub me!", "Tap tap tap!"]); }
function scrub(x, y) {
  if (!act) return;
  if (act.scrubs >= 6) return;
  act.scrubs++;
  for (let i = 0; i < 5; i++) act.bubbles.push({ x: 60 + Math.random() * 170, y: 150 + Math.random() * 60, r: 6 + Math.random() * 12, life: 30 + Math.random() * 20 });
  if (act.scrubs === 6) { care.bathed = Date.now(); store.set("tinny-care", care); setTimeout(() => act && act.kind === "bath" && finish(["Squeaky", "clean!"]), 1400); }
}
function drawBath(now, u) {
  sky("#cfeaf7", "#eaf6fc");
  for (let y = 0; y < 230; y += 32) for (let x = (y / 32) % 2 ? 16 : 0; x < W; x += 32) rect(x, y, 30, 30, "#bfe0ef");
  rect(0, 230, W, 90, "#9fd2e6");
  const u2 = u, ty = 240 - 27 * u2 + (tick % 4 < 2 ? 0 : 2);
  tinny(50, ty, u2, { eyes: act.scrubs >= 6 ? "happy" : tick % 9 ? undefined : "closed", mouth: "open", arms: "up", dirt: act.scrubs < 4 });
  // the tub, in front
  ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#16181f"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(24, 196, 260, 80, [10, 10, 40, 40]); ctx.fill(); ctx.stroke();
  rect(50, 276, 12, 16, "k"); rect(246, 276, 12, 16, "k");

/* ---------------- touch calibration ---------------- */
// The little screen's touch layer can sit a bit off from its picture. A grown-up
// starts this from the admin page and taps five stars; from then on every tap
// is corrected (a best-fit straight-line map from where the screen thought the
// tap was to where the star really is). Kept on this screen.
const CAL_PTS = [[60, 60], [420, 60], [420, 260], [60, 260], [240, 160]];
let cal = store.get("tinny-cal", null), calTs = store.get("tinny-cal-ts", 0), calib = null;
function startCalibration() { calib = { i: 0, raw: [], msg: null, t0: Date.now() }; act = null; }
function solveCal(raw) {
  const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], bx = [0, 0, 0], by = [0, 0, 0];
  raw.forEach(([x, y], k) => { const r = [x, y, 1]; for (let i = 0; i < 3; i++) { for (let j = 0; j < 3; j++) M[i][j] += r[i] * r[j]; bx[i] += r[i] * CAL_PTS[k][0]; by[i] += r[i] * CAL_PTS[k][1]; } });
  const det = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det(M);
  if (Math.abs(D) < 1e-6) return null;
  const solve = (b) => [0, 1, 2].map(col => det(M.map((row, i) => row.map((v, j) => (j === col ? b[i] : v)))) / D);
  return [...solve(bx), ...solve(by)];
}
const applyCal = (x, y, k = cal) => (k ? [k[0] * x + k[1] * y + k[2], k[3] * x + k[4] * y + k[5]] : [x, y]);
function calibTap(x, y) {
  calib.raw.push([x, y]); calib.i++;
  if (calib.i < CAL_PTS.length) return;
  const k = solveCal(calib.raw);
  const worst = k ? Math.max(...calib.raw.map((r, i) => { const [cx, cy] = applyCal(r[0], r[1], k); return Math.hypot(cx - CAL_PTS[i][0], cy - CAL_PTS[i][1]); })) : 999;
  if (k && worst < 40) { cal = k; store.set("tinny-cal", cal); calib = { done: Date.now() }; }
  else calib = { i: 0, raw: [], msg: "Let's try that again: tap right on each star.", t0: Date.now() };
}
function drawCalibration() {
  rect(0, 0, W, H, "#16181f");
  if (calib.done) {
    text("All set!", 240, 140, 40, "#fff", "center"); text("Taps now land where you touch.", 240, 184, 22, "#c9d4ff", "center");
    if (ago(calib.done) > 2.5) calib = null;
    return;
  }
  if (ago(calib.t0) > 90) { calib = null; return; }        // nobody's here: keep the old one
  const [x, y] = CAL_PTS[calib.i];
  for (const r of [34, 22]) { ctx.strokeStyle = "#ffd84a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + (tick % 4), 0, 7); ctx.stroke(); }
  rect(x - 40, y - 1, 80, 2, "#ffd84a"); rect(x - 1, y - 40, 2, 80, "#ffd84a");
  text("⭐", x, y + 9, 24, "#000", "center");
  const ty = y > 200 ? 40 : y < 100 ? 300 : 300;
  text(calib.msg || "Grown-up: tap the middle of the star", 240, ty - 22, fit(calib.msg || "Grown-up: tap the middle of the star", 20, 440), "#fff", "center");
  text(`${calib.i + 1} of ${CAL_PTS.length}`, 240, ty + 6, 18, "#c9d4ff", "center");
}

  for (const r of rings) {
    const k = ago(r.at) / 0.5, rad = 10 + k * 36;
    ctx.globalAlpha = 1 - k; ctx.lineWidth = 6; ctx.strokeStyle = "#16181f"; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 7); ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = "#ffd84a"; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (Date.now() - lastDown < 220) return;            // these touch panels often report one press twice
  lastDown = lastTap = Date.now();
  const r = c.getBoundingClientRect();
  let x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (c.style.transform) { x = W - x; y = H - y; }     // the screen is flipped
  if (calib) { if (!calib.done) calibTap(x, y); drawScene(new Date()); return; }
  [x, y] = applyCal(x, y);
  rings.push({ x, y, at: Date.now() });
  if (doc?.screen?.tapDots) taps = [...taps.slice(-5), { x, y, at: Date.now() }];
  const fn = hit(x, y);
  try { if (fn) fn(x, y); else pet(); } catch (err) { act = null; }
  drawScene(new Date());     // show the answer to the tap now, and with it the new targets
});
addEventListener("keydown", pet);

/* ---------------- go ---------------- */
document.fonts.load("700 20px Andika").finally(async () => {
  await refresh();
  setInterval(refresh, 10000);
  setInterval(getWeather, 20 * 60 * 1000);
  setInterval(() => { tick++; drawScene(new Date()); }, 1000 / FPS);
});
</script>
