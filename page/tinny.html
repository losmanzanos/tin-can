<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tinny</title>
<style>
@font-face { font-family: "Andika"; src: url("/fonts/andika-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #16181f; touch-action: none; -webkit-user-select: none; user-select: none; cursor: none; }
body { display: grid; place-items: center; }
/* Drawn at the little screen's own 480x320 and scaled to fit anything else. */
canvas { display: block; width: min(100vw, 150vh); height: min(66.667vw, 100vh); image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="480" height="320"></canvas>
<script src="/render.js"></script>
<script>
// Tinny: a little tin-can pet for the 3.5" touchscreen. Its mood comes from the
// house: a new postcard, her calendar, the weather, bedtime, hugs from the
// admin page, and a gentle "call Grandpa?" now and then. Any tap pets it.
const PB = window.PhoneBook;
const W = 480, H = 320, FPS = 8;
const c = document.getElementById("c"), ctx = c.getContext("2d");
const COL = { k: "#16181f", g: "#b9c0cc", l: "#e4e8ef", d: "#8b93a3", w: "#ffffff", p: "#f2a1a8", m: "#e9ad1c", r: "#e2413b",
              b: "#2f6fb5", y: "#ffd84a", o: "#ef7f2c", t: "#46bfc0", v: "#b768d6", s: "#5fae4a" };
const NUDGE_EVERY_MIN = 30, NUDGE_FOR_MIN = 1;   // a "call someone?" minute every half hour
const MORNING_MIN = 20;                          // "good morning" for the first 20 minutes
const HUG_SECONDS = 20;

let doc = null, cards = [], seenTs = 0, hug = {}, weather = null, version = null;
let hearts = [], wiggleUntil = 0, nudgeDismissed = -1, tick = 0;
const images = {}, photos = {};
let hugShown = 0;
try { hugShown = +localStorage.getItem("tinny-hug") || 0; } catch (e) {}

/* ---------------- data ---------------- */
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function refresh() {
  try {
    const v = await getJSON("/api/version");
    if (version && v.boot !== version.boot) return location.reload();   // the Pi was updated
    if (!version || v.version !== version.version) {
      [doc, cards] = await Promise.all([getJSON("/api/contacts"), getJSON("/api/postcards")]);
      version = v;
      for (const t of doc.tiles || []) if (t.kind === "photo" && t.photo && !photos[t.photo]) loadImg("/photos/" + encodeURIComponent(t.photo), (img) => (photos[t.photo] = img));
      if (cards[0]?.photo) loadImg(`/postcards/${cards[0].id}.jpg`);
      if (!weather && doc.tinny?.lat != null) getWeather();
    }
    const t = await getJSON("/api/tinny");
    seenTs = t.seen || 0; hug = t.hug || {};
  } catch (e) { /* the Pi is busy or restarting: try again soon */ }
}
function loadImg(src, done) {
  if (images[src]) return images[src];
  const img = new Image();
  img.onload = () => { images[src] = img; done && done(img); };
  img.src = src;
}
// Open-Meteo: free, no key. Asked from this browser every 20 minutes.
async function getWeather() {
  const t = doc?.tinny;
  if (!t || t.lat == null) { weather = null; return; }
  const f = t.units !== "C";
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${t.lat}&longitude=${t.lon}&current=temperature_2m,weather_code` +
    `&hourly=precipitation_probability,weather_code&forecast_hours=3&timezone=auto${f ? "&temperature_unit=fahrenheit" : ""}`;
  try {
    const w = await getJSON(url);
    const code = w.current.weather_code, temp = Math.round(w.current.temperature_2m);
    const soon = (w.hourly?.weather_code || []).slice(0, 3), prob = Math.max(0, ...(w.hourly?.precipitation_probability || []).slice(0, 3));
    const wet = (k) => (k >= 51 && k <= 67) || (k >= 80 && k <= 82) || k >= 95;
    const snowy = (k) => (k >= 71 && k <= 77) || k === 85 || k === 86;
    const tf = f ? temp : temp * 9 / 5 + 32;
    weather = {
      temp, unit: f ? "°" : "°C", code,
      rain: wet(code) || (soon.some(wet) && prob >= 50),
      snow: snowy(code) || soon.some(snowy),
      cold: tf <= 42, hot: tf >= 85,
      icon: snowy(code) ? "❄️" : wet(code) ? "🌧️" : code >= 45 && code <= 48 ? "🌫️" : code >= 2 ? "⛅" : "☀️",
    };
  } catch (e) { /* no internet: Tinny just skips the weather */ }
}

/* ---------------- what's going on ---------------- */
const hm = (d) => d.getHours() * 60 + d.getMinutes();
const toMin = (s) => { const [h, m] = (s || "0:0").split(":").map(Number); return h * 60 + m; };
function asleep(now) {   // asleep whenever her big screen is off
  const on = toMin(doc?.screen?.on || "08:00"), off = toMin(doc?.screen?.off || "20:00"), m = hm(now);
  if (on === off) return false;
  return on < off ? !(m >= on && m < off) : !(m >= on || m < off);
}
function nowTiles(now) {
  if (!doc) return [];
  const tiles = Object.fromEntries((doc.tiles || []).map(t => [t.id, t]));
  return ((doc.week?.[PB.weekdayOf(now)] || [])[PB.periodAt(now)] || []).map(id => tiles[id]).filter(Boolean);
}
function newCard() { return cards.find(c => c.ts > seenTs) && cards[0]; }
function weeksOld(now) {
  let born = doc?.tinny?.born;
  try { born = born || +localStorage.getItem("tinny-born") || 0; if (!born) { born = Math.floor(now / 1000); localStorage.setItem("tinny-born", born); } } catch (e) { born = born || now / 1000; }
  return Math.max(1, Math.floor((now / 1000 - born) / 604800) + 1);
}
// Someone to call: the people she hasn't heard from (by postcard) the longest.
function nudgeFor(now) {
  const m = hm(now);
  const slot = Math.floor(m / NUDGE_EVERY_MIN);
  if (m % NUDGE_EVERY_MIN >= NUDGE_FOR_MIN || slot === nudgeDismissed || m < toMin(doc?.screen?.on) + MORNING_MIN) return null;
  const callable = (doc?.people || []).filter(p => p.pad || p.code);
  if (!callable.length) return null;
  const heard = (p) => Math.max(0, ...cards.filter(c => c.from === p.name || c.from.includes(p.name)).map(c => c.ts));
  const ranked = callable.map(p => ({ p, last: heard(p) })).sort((a, b) => a.last - b.last).slice(0, 3);
  const pick = ranked[slot % ranked.length];
  return { person: pick.p, slot, longAgo: now / 1000 - pick.last > 7 * 86400 };
}
function scene(now) {
  if (!doc) return "loading";
  if (doc.screen?.board === "off") return "off";
  if (asleep(now)) return "bedtime";
  if (hug.ts && hug.ts > hugShown && now / 1000 - hug.ts < HUG_SECONDS) return "hug";
  if (newCard()) return "postcard";
  const since = hm(now) - toMin(doc.screen?.on || "08:00");
  if (since >= 0 && since < MORNING_MIN) return "morning";
  if (nudgeFor(now)) return "nudge";
  return "day";
}

/* ---------------- what Tinny wears ---------------- */
function outfit(tiles) {
  const words = tiles.map(t => (t.label + " " + (t.emoji || "")).toLowerCase()).join(" ");
  const has = (...ks) => ks.some(k => words.includes(k));
  const o = {};
  if (has("swim", "pool", "🏊")) o.goggles = true;
  if (has("school", "🎒", "class")) o.backpack = true;
  if (has("bike", "🚲", "scooter")) o.hat = "helmet";
  else if (has("special", "party", "birthday", "⭐", "🎉", "🎂")) o.hat = "party";
  else if (has("art", "🎨", "paint", "draw")) o.hat = "beret";
  else if (has("dance", "💃", "ballet")) o.hat = "bow";
  if (has("bed", "🌙", "sleep")) o.hat = o.hat || "nightcap";
  if (weather?.hot && !o.goggles) o.shades = true;
  if (weather?.cold) o.scarf = true;
  if (weather?.rain) { o.umbrella = true; if (o.hat === "helmet") delete o.hat; }
  if (weather?.snow && !o.hat) o.snowcap = true;
  return o;
}

/* ---------------- drawing ---------------- */
function rect(x, y, w, h, col) { ctx.fillStyle = COL[col] || col; ctx.fillRect(x, y, w, h); }
function sky(top, bottom) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function ground(col, tuft) { rect(0, 266, W, 54, col); if (tuft) for (let x = 0; x < W; x += 28) rect(x, 266, 14, 6, tuft); }
function text(s, x, y, size, col = "#16181f", align = "left") {
  ctx.font = `700 ${size}px Andika, "Noto Color Emoji", sans-serif`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y);
}
function fit(s, size, maxW) { ctx.font = `700 ${size}px Andika`; while (size > 12 && ctx.measureText(s).width > maxW) { size--; ctx.font = `700 ${size}px Andika`; } return size; }
function pill(x, y, w, h, label, size = 19, bg = "#16181f", fg = "#fff") {
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  text(label, x + w / 2, y + h / 2 + size * 0.36, size, fg, "center");
}
function bubble(x, y, w, h, lines, size, tailX) {
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#16181f"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tailX, y + h - 2); ctx.lineTo(tailX - 16, y + h + 22); ctx.lineTo(tailX + 18, y + h - 2); ctx.fill(); ctx.stroke();
  rect(tailX + 2, y + h - 6, 14, 6, "w");
  const sz = Math.min(size, ...lines.map(l => fit(l, size, w - 32)));
  lines.forEach((l, i) => text(l, x + 16, y + h / 2 + (i - (lines.length - 1) / 2) * (sz + 6) + sz * 0.36, sz));
}
const HEART = [".xx.xx.", "xxxxxxx", "xxxxxxx", ".xxxxx.", "..xxx..", "...x..."];
function heart(x, y, u, col) { ctx.fillStyle = col; HEART.forEach((r, j) => [...r].forEach((ch, i) => ch === "x" && ctx.fillRect(x + i * u, y + j * u, u, u))); }
function sparkle(x, y, u, col = "#e9ad1c") { rect(x + u, y, u, 3 * u, col); rect(x, y + u, 3 * u, u, col); }

// Tinny itself, on a grid of u-pixel squares. 26 wide, about 27 tall.
function tinny(ox, oy, u, o = {}) {
  const px = (x, y, col, w = 1, h = 1) => rect(ox + x * u, oy + y * u, w * u, h * u, col);
  const sq = o.squish ? 1 : 0, top = 5 + sq, bot = 24;
  if (o.umbrella) {   // held in its right hand, canopy over its head
    px(22, top - 4, "k", 1, bot - top);
    px(13, top - 5, "r", 18, 1); px(15, top - 6, "r", 14, 1); px(18, top - 7, "r", 8, 1);
    for (let i = 0; i < 3; i++) px(15 + i * 6, top - 5, "w", 2, 1);
  }
  if (o.backpack) { px(1, top + 6, "k", 4, 11); px(2, top + 7, "r", 2, 9); }
  if (!o.hat && !o.cap && !o.umbrella) { px(13, 1 + sq, "k", 1, top - 1 - sq); px(12, sq, "m", 3, 2); px(12, sq, "k"); }
  // the can
  px(5, top, "k", 16, 1); px(4, top + 1, "k", 1, bot - top - 1); px(21, top + 1, "k", 1, bot - top - 1); px(5, bot, "k", 16, 1);
  px(5, top + 1, "g", 16, bot - top - 1);
  px(5, top + 1, "l", 16, 2); px(5, top + 3, "d", 16, 1); px(5, bot - 3, "d", 16, 1);
  px(6, top + 5, "l", 1, bot - top - 9); px(7, top + 5, "l", 1, 2);
  if (o.snowcap) { px(5, top - 1, "w", 16, 2); px(7, top - 2, "w", 5, 1); px(14, top - 2, "w", 4, 1); }
  if (o.backpack) { px(6, top + 4, "r", 1, 15); px(19, top + 4, "r", 1, 15); }
  // face
  const ey = top + 7;
  if (o.eyes === "closed" || o.blink) { px(8, ey + 1, "k", 3, 1); px(15, ey + 1, "k", 3, 1); }
  else if (o.eyes === "happy") { px(8, ey + 1, "k"); px(9, ey, "k"); px(10, ey + 1, "k"); px(15, ey + 1, "k"); px(16, ey, "k"); px(17, ey + 1, "k"); }
  else if (o.eyes === "sad") { px(8, ey, "k"); px(9, ey, "k", 2, 3); px(9, ey, "w"); px(15, ey, "k", 2, 3); px(17, ey, "k"); px(15, ey, "w"); }
  else { px(9, ey, "k", 2, 3); px(9, ey, "w"); px(15, ey, "k", 2, 3); px(15, ey, "w"); }
  if (o.goggles) { px(5, ey, "t", 16, 1); px(7, ey - 1, "k", 6, 5); px(14, ey - 1, "k", 6, 5); px(8, ey, "t", 4, 3); px(15, ey, "t", 4, 3); px(9, ey, "w"); px(16, ey, "w"); }
  if (o.shades) { px(7, ey - 1, "k", 5, 4); px(14, ey - 1, "k", 5, 4); px(12, ey, "k", 2, 1); px(8, ey, "d"); px(15, ey, "d"); }
  px(7, ey + 3, "p", 2, 1); px(17, ey + 3, "p", 2, 1);
  const my = ey + 4;
  if (o.mouth === "open") { px(12, my, "k", 3, 1); px(12, my + 1, "r", 3, 1); px(13, my + 2, "k"); px(11, my, "k", 1, 2); px(15, my, "k", 1, 2); }
  else if (o.mouth === "flat") px(12, my + 1, "k", 3, 1);
  else if (o.mouth === "o") px(12, my, "k", 2, 2);
  else { px(11, my, "k"); px(12, my + 1, "k", 3, 1); px(15, my, "k"); }
  if (o.scarf) { px(4, my + 3, "r", 18, 2); px(6, my + 3, "w", 2, 2); px(12, my + 3, "w", 2, 2); px(18, my + 3, "w", 2, 2); px(17, my + 5, "r", 3, 4); }
  // arms
  if (o.arms === "up") { px(2, top + 2, "k", 2, 6); px(22, top + 2, "k", 2, 6); }
  else if (o.arms === "hug") { px(2, top + 9, "k", 2, 3); px(22, top + 9, "k", 2, 3); px(6, top + 12, "k", 4, 2); px(16, top + 12, "k", 4, 2); }
  else if (o.arms === "phone") { px(2, top + 11, "k", 2, 3); px(22, top + 8, "k", 2, 2); px(23, top + 6, "k", 2, 2); }
  else { px(2, top + 10, "k", 2, 4); if (o.umbrella) px(22, top + 9, "k", 2, 2); else px(22, top + 10, "k", 2, 4); }
  px(7, bot + 1, "k", 4, 2); px(15, bot + 1, "k", 4, 2);
  // hats
  const hat = o.cap ? "nightcap" : o.hat;
  if (hat === "nightcap") { px(6, top - 3, "b", 14, 3); px(9, top - 5, "b", 8, 2); px(13, top - 7, "b", 4, 2); px(17, top - 7, "w", 3, 3); px(5, top - 1, "w", 16, 1); }
  if (hat === "helmet") { px(5, top - 4, "k", 16, 5); px(6, top - 3, "o", 14, 3); px(8, top - 3, "w", 2, 1); px(4, top, "k", 18, 1); }
  if (hat === "party") { px(10, top - 1, "v", 7, 1); px(11, top - 3, "v", 5, 2); px(12, top - 5, "y", 3, 2); px(13, top - 7, "v", 1, 2); px(12, top - 8, "y", 3, 1); px(11, top - 2, "y"); px(14, top - 4, "w"); }
  if (hat === "beret") { px(6, top - 2, "r", 14, 2); px(8, top - 3, "r", 10, 1); px(13, top - 4, "k", 1, 1); }
  if (hat === "bow") { px(14, top - 2, "p", 3, 3); px(18, top - 2, "p", 3, 3); px(17, top - 1, "r", 1, 1); }
}

// A tile from her calendar, framed like a magnet, for Tinny to "hold up".
function tileCard(t, x, y, s) {
  ctx.fillStyle = "#16181f"; ctx.beginPath(); ctx.roundRect(x - 3, y - 3, s + 6, s + 10, 14); ctx.fill();
  PB.drawTile(ctx, t, x, y, s, photos);
}

/* ---------------- the scenes ---------------- */
function drawDay(now, o, u, bob) {
  const p = PB.periodAt(now);
  const wet = weather?.rain, snow = weather?.snow;
  if (wet) sky("#9aa6b6", "#cfd6df");
  else if (p === 0) sky("#ffd7b0", "#fdf0dc");
  else if (p === 1) sky("#bfe3f5", "#e8f5fb");
  else sky("#b49ad8", "#f6c7a6");
  ground(snow ? "#f3f6fb" : p === 2 ? "#7aa65a" : "#8fcf6a", snow ? "#dfe6f1" : "#7cbd58");
  if (wet) for (let i = 0; i < 26; i++) { const x = (i * 53 + tick * 9) % W, y = (i * 37 + tick * 22) % 260; rect(x, y, 2, 10, "#5f7a9a"); }
  if (snow) for (let i = 0; i < 22; i++) { const x = (i * 61 + tick * 3 + Math.sin(tick / 3 + i) * 6) % W, y = (i * 29 + tick * 6) % 262; rect(x, y, 4, 4, "#fff"); }
  if (weather?.cold && tick % 16 < 8) { ctx.globalAlpha = 0.6; rect(52 + 12 * u, 120 + bob - tick % 8 * 3, 10, 8, "#fff"); ctx.globalAlpha = 1; }
  const tiles = nowTiles(now);
  tinny(40, 266 - 27 * u + bob, u, { ...o, ...outfit(tiles) });
  // What's happening now, on the right.
  const label = tiles.length ? tiles.map(t => t.label).join(" + ") : "Free time";
  pill(270, 26, 186, 34, PB.PERIODS[p] + (tiles.length ? "" : ""), 18, PB.DAY_COLORS[PB.weekdayOf(now)]);
  if (tiles[0]) tileCard(tiles[0], 300, 76, 120);
  else { ctx.fillStyle = "#ffffffaa"; ctx.beginPath(); ctx.roundRect(300, 76, 120, 120, 16); ctx.fill(); text("😊", 360, 152, 56, "#000", "center"); }
  if (tiles[1]) tileCard(tiles[1], 392, 150, 58);
  text(label, 363, 236, fit(label, 21, 190), "#16181f", "center");
}

function drawScene(now) {
  const name = scene(now);
  const weeks = weeksOld(now), u = weeks < 2 ? 6 : weeks < 6 ? 7 : 8;   // grows a little over the first weeks
  const bob = (tick % 8 < 4) ? 0 : 2;
  const blink = tick % 37 === 0 || tick % 37 === 1;
  const petting = Date.now() < wiggleUntil;
  const wig = petting ? (tick % 2 ? 4 : -4) : 0;
  ctx.save();
  if (name === "off" || name === "loading") { rect(0, 0, W, H, "#000"); ctx.restore(); return; }

  if (name === "bedtime") {
    sky("#121a3a", "#283567"); ground("#1d2547");
    for (const [x, y, s] of [[40, 30, 2], [120, 70, 3], [220, 24, 2], [300, 90, 2], [430, 140, 3], [380, 40, 2], [70, 190, 2], [200, 140, 2]])
      rect(x, y, s * 2, s * 2, (tick + x) % 24 < 3 ? "#7d86b8" : "#fff6c8");
    ctx.fillStyle = "#ffe08a"; ctx.beginPath(); ctx.arc(80, 90, 34, 0, 7); ctx.fill();
    ctx.fillStyle = "#16204a"; ctx.beginPath(); ctx.arc(64, 78, 32, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.85; tinny(120 + wig, 266 - 27 * u + 4, u, { eyes: "closed", mouth: "flat", cap: true, squish: tick % 16 < 8 }); ctx.globalAlpha = 1;
    const z = tick % 24;
    text("z", 296, 132 - (z % 8), 24, "#c9d4ff"); if (z >= 8) text("z", 318, 100 - (z % 8), 32, "#c9d4ff"); if (z >= 16) text("Z", 346, 62 - (z % 8), 42, "#c9d4ff");
    text("Goodnight, Zelda", 458, 302, 20, "#c9d4ff", "right");
  }

  else if (name === "postcard") {
    const card = newCard();
    sky("#bfe3f5", "#e8f5fb"); ground("#8fcf6a", "#7cbd58");
    const hop = tick % 6 < 3 ? -8 : 0;
    tinny(40 + wig, 100 + hop, 7, { eyes: "happy", mouth: "open", arms: "up" });
    rect(48, 34 + hop, 166, 98, "k"); rect(54, 40 + hop, 154, 86, "w"); rect(54, 40 + hop, 154, 8, "m");
    const img = card.photo && images[`/postcards/${card.id}.jpg`];
    if (img) {
      const bw = 150, bh = 74, s = Math.max(bw / img.naturalWidth, bh / img.naturalHeight);
      const sw = bw / s, sh = bh / s;
      ctx.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, 56, 50 + hop, bw, bh);
    } else if (card.caption) {
      text(card.caption, 131, 96 + hop, fit(card.caption, 22, 140), "#16181f", "center");
    } else heart(106, 64 + hop, 7, "#e2413b");
    if (tick % 4 < 2) { sparkle(30, 28, 6); sparkle(210, 128, 4); } else sparkle(222, 46, 5);
    const who = (card.from || "Someone").replace(/^from /i, "");
    bubble(250, 40, 210, 96, [who + " sent", "you something!"], 23, 276);
    if (tick % 8 < 6) { pill(256, 196, 200, 52, "📬  Press yellow!", 21); }
  }

  else if (name === "hug") {
    sky("#ffd6e0", "#fff0f3"); ground("#f4b9c8");
    tinny(150 + wig, 266 - 27 * u + 6, u, { eyes: "happy", mouth: "open", arms: "up", squish: tick % 4 < 2 });
    heart(150 + 13 * u - 35, 22 - (tick % 4) * 2, 10, "#e2413b");
    for (let i = 0; i < 5; i++) heart((60 + i * 88) % W, 230 - ((tick * 6 + i * 50) % 230), 4 + (i % 3), i % 2 ? "#f2a1a8" : "#e2413b");
    pill(110, 262, 260, 48, `Hug from ${hug.from || "someone"}!`, fit(`Hug from ${hug.from || "someone"}!`, 24, 230));
  }

  else if (name === "morning") {
    sky("#ffc9a1", "#fff1dc"); ground("#8fcf6a", "#7cbd58");
    ctx.fillStyle = "#ffd84a"; ctx.beginPath(); ctx.arc(462, 266, 40, Math.PI, 0); ctx.fill();
    for (let i = 0; i < 5; i++) { const a = Math.PI + (i + 0.5) * Math.PI / 5; rect(462 + Math.cos(a) * 56 - 4, 266 + Math.sin(a) * 56 - 4, 8, 8, "#ffd84a"); }
    const stretch = tick % 12 < 6;
    tinny(40, 266 - 27 * u + (stretch ? -4 : 0), u, { eyes: stretch ? "closed" : "happy", mouth: stretch ? "o" : "open", arms: stretch ? "up" : undefined, ...outfit(nowTiles(now)) });
    const first = nowTiles(now)[0];
    const day = PB.DAYS[PB.weekdayOf(now)];
    bubble(220, 22, 240, 86, ["Good morning,", "Zelda!"], 26, 246);
    pill(232, 128, 216, 36, `It's ${day}!`, 20, PB.DAY_COLORS[PB.weekdayOf(now)]);
    if (first) { tileCard(first, 240, 178, 64); text(first.label, 318, 218, fit(first.label, 20, 110)); }
  }

  else if (name === "nudge") {
    const n = nudgeFor(now), p = n.person;
    sky("#d9dde6", "#eef0f4"); ground("#c9c2b0");
    tinny(36 + wig, 266 - 27 * u + bob, u, { eyes: n.longAgo ? "sad" : undefined, mouth: n.longAgo ? "o" : "smile", arms: "phone" });
    // its own tin-can phone, with the string trailing off the screen
    const px = 36 + 23 * u, py = 266 - 27 * u + 9 * u + bob;
    rect(px, py, 30, 38, "k"); rect(px + 4, py + 4, 22, 30, "g"); rect(px + 4, py + 4, 22, 6, "l");
    ctx.strokeStyle = "#16181f"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px + 30, py + 26);
    ctx.bezierCurveTo(px + 90, py + 110 + Math.sin(tick / 2) * 8, 380, 120, 490, 180); ctx.stroke();
    bubble(214, 16, 246, 82, [`Call ${p.name}?`, n.longAgo ? "It's been a while!" : "Say hi!"], 22, 240);
    // the same card as in her phone book, so she knows which button
    ctx.fillStyle = "#fbf5e8"; ctx.strokeStyle = "#16181f"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(236, 176, 222, 82, 16); ctx.fill(); ctx.stroke();
    PB.drawPerson(ctx, p, { x: 248, y: 180, w: 200, h: 74 }, 74, photos);
  }

  else drawDay(now, { blink, eyes: petting ? "happy" : undefined, mouth: petting ? "open" : undefined }, u, bob + 0);

  if (name === "day" || name === "nudge" || name === "morning") pill(14, 14, 112, 32, `⭐ Week ${weeks}`, 17);
  if (weather && name === "day") pill(14, 52, 104, 32, `${weather.icon} ${weather.temp}${weather.unit}`, 17, "#ffffffcc", "#16181f");
  // hearts from petting float up and fade
  hearts = hearts.filter(h => h.life > 0);
  for (const h of hearts) { ctx.globalAlpha = Math.min(1, h.life / 6); heart(h.x, h.y, h.u, h.col); h.y -= 7; h.x += Math.sin(h.life) * 2; h.life--; }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------------- touch ---------------- */
// The screen's touch is rough, so any tap anywhere counts.
function pet() {
  const now = new Date(), name = scene(now);
  if (name === "nudge") nudgeDismissed = Math.floor(hm(now) / NUDGE_EVERY_MIN);
  if (name === "hug") { hugShown = hug.ts; try { localStorage.setItem("tinny-hug", hugShown); } catch (e) {} }
  wiggleUntil = Date.now() + 2500;
  const few = name === "bedtime" ? 1 : 4;
  for (let i = 0; i < few; i++)
    hearts.push({ x: 60 + Math.random() * 200, y: 70 + Math.random() * 60, u: 4 + Math.floor(Math.random() * 3), col: i % 2 ? "#f2a1a8" : "#e2413b", life: 14 + Math.floor(Math.random() * 6) });
}
addEventListener("pointerdown", (e) => { e.preventDefault(); pet(); });
addEventListener("keydown", pet);

/* ---------------- go ---------------- */
document.fonts.load("700 20px Andika").finally(async () => {
  await refresh();
  setInterval(refresh, 10000);
  setInterval(getWeather, 20 * 60 * 1000);
  setInterval(() => { tick++; drawScene(new Date()); }, 1000 / FPS);
});
</script>
