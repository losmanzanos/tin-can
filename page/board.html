<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zelda's Magnet Board</title>
<style>
@font-face { font-family: "Andika"; src: url("/fonts/andika-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
:root { --paper: #fbf5e8; --ink: #16181f; --mustard: #e9ad1c; --rule: #d8cdb4; --day: #e2413b; --dayText: #d6332d; --u: 1vmin; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Andika", sans-serif; touch-action: none; cursor: default; }
body { display: grid; grid-template-rows: auto 1fr; gap: calc(var(--u) * 2); padding: calc(var(--u) * 2.5) calc(var(--u) * 3); }

/* The week across the top, in her board's colors. Past days are folded. */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: calc(var(--u) * 1.6); }
.days button { height: calc(var(--u) * 13); border: calc(var(--u) * 0.8) solid transparent; border-radius: calc(var(--u) * 3); background: var(--c);
  color: #fff; font: 700 calc(var(--u) * 6.5) "Andika", sans-serif; position: relative; transition: transform .15s; }
.days button.light { color: var(--ink); }
.days button.past { opacity: .4; height: calc(var(--u) * 9); align-self: end; }
.days button[aria-pressed=true] { border-color: var(--ink); transform: translateY(calc(var(--u) * -1)); box-shadow: 0 calc(var(--u) * 1) 0 var(--ink); }
.days button .star { position: absolute; top: calc(var(--u) * -2.2); right: calc(var(--u) * -1.2); font-size: calc(var(--u) * 5); }

.main { display: grid; grid-template-columns: 1fr 1.05fr; gap: calc(var(--u) * 3); min-height: 0; }
/* A phone held upright: the day on top, the magnets underneath. */
@media (orientation: portrait) {
  .main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .day { grid-template-rows: auto repeat(3, calc(var(--u) * 24)); row-gap: calc(var(--u) * 1.2); }
}

/* The day: a colored frame with three rows, like one column of her board. */
.day { display: grid; grid-template-rows: auto 1fr 1fr 1fr; border: calc(var(--u) * 1.6) solid var(--day); border-radius: calc(var(--u) * 4);
  background: #fffdf7; padding: calc(var(--u) * 1) calc(var(--u) * 2) calc(var(--u) * 1.6); min-height: 0; }
.day h1 { text-align: center; color: var(--dayText); font-size: calc(var(--u) * 6); line-height: 1.2; border-bottom: calc(var(--u) * 0.5) solid var(--day); margin: 0 calc(var(--u) * 6) calc(var(--u) * 1); }
.row { display: grid; grid-template-columns: calc(var(--u) * 10) 1fr; align-items: center; gap: calc(var(--u) * 1.5); border-radius: calc(var(--u) * 3); padding: 0 calc(var(--u) * 1); min-height: 0; transition: background .12s; }
.row.now { background: var(--dayTint); }
.row.over { background: rgba(233, 173, 28, 0.45); outline: calc(var(--u) * 0.6) dashed var(--ink); }
.row canvas.icon { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
.slots { display: flex; gap: calc(var(--u) * 2); justify-content: center; align-items: center; height: 100%; }
.slot { width: calc(var(--u) * 17); height: calc(var(--u) * 17); border: calc(var(--u) * 0.6) dashed var(--rule); border-radius: calc(var(--u) * 3); }

/* The tile tray: every magnet she can use. */
/* Pages of magnets: swipe sideways on the tray, or tap the arrows. */
.tray { background: #efe6d2; border-radius: calc(var(--u) * 4); padding: calc(var(--u) * 2); display: grid; grid-template-rows: minmax(0, 1fr) auto;
  gap: calc(var(--u) * 1.6); overflow: hidden; min-height: 0; touch-action: none; transition: background .12s; }
.trayPage { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: calc(var(--u) * 1.6); align-content: start; min-height: 0; }
.trayNav { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 2); }
.trayNav button { width: calc(var(--u) * 11); height: calc(var(--u) * 11); border: 0; border-radius: 50%; background: var(--ink); color: #fff;
  font-size: calc(var(--u) * 4.6); line-height: 1; cursor: pointer; box-shadow: 0 calc(var(--u) * 0.8) 0 #0006; }
.trayNav button:disabled { opacity: .2; box-shadow: none; }
.dots { display: flex; gap: calc(var(--u) * 1.8); }
.dots i { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: 50%; background: #cbbd99; }
.dots i.on { background: var(--ink); transform: scale(1.25); }
.tray.over { background: #e4d6b6; outline: calc(var(--u) * 0.6) dashed var(--ink); }

.tile { width: calc(var(--u) * 17); height: calc(var(--u) * 17); display: block; touch-action: none; }
/* Big enough for a small finger. */
.tray .tile { width: calc(var(--u) * var(--tt, 17)); height: calc(var(--u) * var(--tt, 17)); justify-self: center; }
.tile.placed { animation: pop .25s ease-out; }
@keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
.ghost { position: fixed; z-index: 10; pointer-events: none; width: calc(var(--u) * 20); height: calc(var(--u) * 20); transform: translate(-50%, -60%) rotate(-4deg);
  filter: drop-shadow(0 calc(var(--u) * 1.5) calc(var(--u) * 1) rgba(0,0,0,.3)); }

/* Night: the screen goes dark between the off and on times. */
.night { position: fixed; inset: 0; background: #000; z-index: 50; display: none; }
.night.on { display: block; }
.msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 8vmin; background: var(--paper); z-index: 40; font-size: calc(var(--u) * 5); line-height: 1.4; }
.msg.on { display: grid; }
.saving { position: fixed; right: calc(var(--u) * 2); bottom: calc(var(--u) * 1.5); font-size: calc(var(--u) * 2.6); color: #8a8169; }
.backToTinny { position: fixed; left: calc(var(--u) * 2); bottom: calc(var(--u) * 2); z-index: 20; border: 0; border-radius: 999px;
  background: var(--ink); color: #fff; font: 700 calc(var(--u) * 5) "Andika", sans-serif; padding: calc(var(--u) * 2) calc(var(--u) * 4); }
.backToTinny.home { background: var(--mustard); color: var(--ink); box-shadow: 0 calc(var(--u) * 0.8) 0 var(--ink); }
/* On the tablet, Home sits at the start of the row of days, out of the way of the magnets. */
.tablet .days { margin-left: calc(var(--u) * 19); }
.tablet .backToTinny.home { left: calc(var(--u) * 3); top: calc(var(--u) * 2.5); bottom: auto; height: calc(var(--u) * 13); width: calc(var(--u) * 17.5);
  padding: 0; border-radius: calc(var(--u) * 3); font-size: calc(var(--u) * 4.2); line-height: 1.1; }
</style>
</head>
<body>
<nav class="days" id="days"></nav>
<div class="main">
  <section class="day" id="day">
    <h1 id="dayName"></h1>
    <div class="row" data-period="0"><canvas class="icon" width="120" height="120"></canvas><div class="slots"></div></div>
    <div class="row" data-period="1"><canvas class="icon" width="120" height="120"></canvas><div class="slots"></div></div>
    <div class="row" data-period="2"><canvas class="icon" width="120" height="120"></canvas><div class="slots"></div></div>
  </section>
  <section class="tray" id="tray" aria-label="Magnets">
    <div class="trayPage" id="trayPage"></div>
    <div class="trayNav"><button type="button" id="prevPage" aria-label="Back">◀</button><span class="dots" id="dots"></span><button type="button" id="nextPage" aria-label="More magnets">▶</button></div>
  </section>
</div>
<div class="night" id="night"></div>
<div class="msg" id="msg"></div>
<div class="saving" id="saving"></div>

<script src="/render.js"></script>
<script>
// Zelda's touch magnet board: drag a magnet from the tray onto a part of the
// day, drag it back to the tray to take it off. Changes show up on her big
// screen too: this page redraws the calendar for it after a short pause.
const PB = window.PhoneBook;
const $ = (id) => document.getElementById(id);
const IDLE_MS = 120000;       // back to today after two minutes
const REDRAW_AFTER_MS = 20000; // wait for her to finish before redrawing the big screen (slow on a Pi 2)

let key = new URLSearchParams(location.hash.slice(1)).get("key") || "";

// On the tablet: opened from its home screen (#...&tablet=1), a big button back to the two
// squares; opened from Tinny (#...&back=1), a big button back to Tinny.
{
  const h = new URLSearchParams(location.hash.slice(1)), tablet = h.get("tablet") === "1" || typeof window.fully !== "undefined";
  if (tablet || h.get("back") === "1") {
    const b = document.createElement("button");
    if (tablet) { document.body.classList.add("tablet"); window.tinnyPopGo = () => "/tinny#board=" + encodeURIComponent(key) + "&tablet=1"; }
    b.type = "button"; b.className = "backToTinny" + (tablet ? " home" : ""); b.textContent = tablet ? "🏡 Home" : "🏠 Tinny";
    b.onclick = () => { location.href = tablet ? "/tablet#board=" + encodeURIComponent(key) : "/tinny#board=" + encodeURIComponent(key); };
    document.body.appendChild(b);
  }
}
try { if (key) localStorage.setItem("zp-board-key", key); else key = localStorage.getItem("zp-board-key") || ""; } catch (e) {}
let doc = null, fb = null, frames = {}, seen = null, day = PB.weekdayOf(new Date()), touched = Date.now(), dragging = null;
const photos = {};

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function message(text) { $("msg").textContent = text || ""; $("msg").classList.toggle("on", !!text); }

async function api(method, url, body) {
  const r = await fetch(url, { method, cache: "no-store", headers: { "X-Board-Key": key, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { message("This board needs a new link.\nOn the admin page: Settings → Magnet board."); throw new Error("no key"); }
  if (!r.ok && r.status !== 409) throw new Error(data.error || r.status);
  return { status: r.status, data };
}

function tileCanvas(t) {
  const c = el("canvas", "tile");
  c.width = c.height = 220;
  c.dataset.id = t.id;
  const draw = () => PB.drawTile(c.getContext("2d"), t, 8, 4, 204, photos);
  if (t.kind === "photo" && t.photo && !photos[t.photo]) {
    const img = new Image();
    img.onload = () => { photos[t.photo] = img; c.getContext("2d").clearRect(0, 0, 220, 220); draw(); };
    img.src = "/photos/" + encodeURIComponent(t.photo);
  }
  draw();
  return c;
}

function render() {
  if (!doc) return;
  // "Flip the little screen" on the admin page: only on the touchscreen Pi.
  document.body.style.transform = KIOSK && doc.screen?.littleFlip ? "rotate(180deg)" : "";
  const today = PB.weekdayOf(new Date());
  document.documentElement.style.setProperty("--day", PB.DAY_COLORS[day]);
  document.documentElement.style.setProperty("--dayText", PB.DAY_TEXT[day]);
  const hex = PB.DAY_COLORS[day], rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  document.documentElement.style.setProperty("--dayTint", `rgba(${rgb.join(",")},0.2)`);
  const days = $("days");
  days.replaceChildren(...PB.DAYS.map((name, d) => {
    const b = el("button", (d === 2 || d === 6 ? "light " : "") + (d < today ? "past" : ""));
    b.style.setProperty("--c", PB.DAY_COLORS[d]);
    b.textContent = name[0];
    b.setAttribute("aria-label", name);
    b.setAttribute("aria-pressed", String(d === day));
    if (d === today) { const s = el("span", "star"); s.textContent = "⭐"; b.append(s); }
    b.onclick = () => { day = d; touched = Date.now(); render(); };
    return b;
  }));
  $("dayName").textContent = (day === today ? "Today · " : "") + PB.DAYS[day];
  const tiles = Object.fromEntries(doc.tiles.map(t => [t.id, t]));
  const period = day === today ? PB.periodAt(new Date()) : -1;
  for (const row of document.querySelectorAll(".row")) {
    const p = +row.dataset.period;
    row.classList.toggle("now", p === period);
    const icon = row.querySelector("canvas.icon").getContext("2d");
    icon.clearRect(0, 0, 120, 120);
    PB.periodIcon(icon, p, 60, 60, 100);
    const slots = row.querySelector(".slots");
    const ids = (doc.week[day][p] || []).filter(id => tiles[id]);
    slots.replaceChildren(...ids.map(id => { const c = tileCanvas(tiles[id]); c.dataset.from = p; return c; }));
    for (let i = ids.length; i < 2; i++) slots.append(el("div", "slot"));
  }
  renderTray();
}

/* ---------- the tray, a page at a time ---------- */
let trayPage = 0, perPage = 9;
function renderTray() {
  const page = $("trayPage");
  // Upright phones get the biggest magnets; wide screens fit more per page.
  const tt = innerHeight > innerWidth ? 21 : 17;
  page.style.setProperty("--tt", tt);
  const u = Math.min(innerWidth, innerHeight) / 100, cell = tt * u, gap = 1.6 * u;
  const cols = Math.max(1, Math.floor((page.clientWidth + gap) / (cell + gap)));
  const rows = Math.max(1, Math.floor((page.clientHeight + gap) / (cell + gap)));
  perPage = cols * rows;
  const pages = Math.max(1, Math.ceil(doc.tiles.length / perPage));
  trayPage = Math.max(0, Math.min(trayPage, pages - 1));
  page.style.setProperty("--cols", cols);
  page.replaceChildren(...doc.tiles.slice(trayPage * perPage, (trayPage + 1) * perPage).map(tileCanvas));
  $("prevPage").disabled = trayPage === 0;
  $("nextPage").disabled = trayPage === pages - 1;
  $("dots").replaceChildren(...Array.from({ length: pages }, (_, i) => { const d = el("i", i === trayPage ? "on" : ""); return d; }));
  document.querySelector(".trayNav").style.visibility = pages > 1 ? "" : "hidden";
}
function turnPage(by) { trayPage += by; touched = Date.now(); renderTray(); }
$("prevPage").onclick = () => turnPage(-1);
$("nextPage").onclick = () => turnPage(1);
addEventListener("resize", () => doc && renderTray());
// A swipe on the tray (not on a magnet) turns the page.
let swipe = null;
$("tray").addEventListener("pointerdown", (e) => { if (!e.target.closest(".tile, button")) swipe = { x: e.clientX, y: e.clientY }; });
document.addEventListener("pointerup", (e) => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) turnPage(dx < 0 ? 1 : -1);
});

/* ---------- dragging ---------- */
function targetAt(x, y) {
  const hit = document.elementFromPoint(x, y);
  return hit?.closest(".row") || hit?.closest("#tray") || null;
}
// Any magnet lifts straight away.
document.addEventListener("pointerdown", (e) => {
  const tile = e.target.closest(".tile");
  if (!tile || dragging) return;
  touched = Date.now();
  startDrag(tile, e);
});
function startDrag(tile, e) {
  e.preventDefault();
  const ghost = tileCanvas(doc.tiles.find(t => t.id === tile.dataset.id));
  ghost.className = "ghost";
  document.body.append(ghost);
  dragging = { id: tile.dataset.id, from: tile.dataset.from != null ? +tile.dataset.from : null, ghost, over: null, startX: e.clientX, startY: e.clientY };
  if (dragging.from != null) tile.style.opacity = ".25";
  move(e);
}
function move(e) {
  if (!dragging) return;
  // The ghost lives inside the page, so when the page is flipped its spot is too.
  const flipped = !!document.body.style.transform;
  dragging.ghost.style.left = (flipped ? innerWidth - e.clientX : e.clientX) + "px";
  dragging.ghost.style.top = (flipped ? innerHeight - e.clientY : e.clientY) + "px";
  const t = targetAt(e.clientX, e.clientY);
  if (t !== dragging.over) {
    dragging.over?.classList.remove("over");
    dragging.over = t;
    t?.classList.add("over");
  }
}
document.addEventListener("pointermove", move);
document.addEventListener("pointerup", (e) => drop(e));
document.addEventListener("pointercancel", () => drop(null));
function drop(e) {
  if (!dragging) return;
  const d = dragging;
  dragging = null;
  d.ghost.remove();
  d.over?.classList.remove("over");
  const target = e ? targetAt(e.clientX, e.clientY) : null;
  const week = doc.week.map(x => x.map(s => s.slice()));
  const slots = week[day];
  let changed = false;
  if (target?.classList.contains("row")) {
    const p = +target.dataset.period;
    if (d.from !== p) {
      if (d.from != null) slots[d.from].splice(slots[d.from].indexOf(d.id), 1);
      if (slots[p].length >= 2) slots[p].shift();   // full: the new magnet pushes the oldest off
      slots[p].push(d.id);
      changed = true;
    }
  } else if (target?.id === "tray" && d.from != null) {
    slots[d.from].splice(slots[d.from].indexOf(d.id), 1);   // dragged back to the tray: take it off
    changed = true;
  } else if (target?.id === "tray" && e && Math.abs(e.clientX - d.startX) > 50) {
    turnPage(e.clientX < d.startX ? 1 : -1);   // a swipe that started on a magnet: turn the page too
    return;
  }
  if (changed) { doc.week = week; render(); markPlaced(target); save(); }
  else render();
}
function markPlaced(target) {
  const last = target?.classList.contains("row") ? target.querySelector(".slots .tile:last-of-type") : null;
  if (last) last.classList.add("placed");
}

/* ---------- saving ---------- */
let saveChain = Promise.resolve(), redrawTimer = null;
function save() {
  const week = doc.week;
  saveChain = saveChain.then(async () => {
    const { status, data } = await api("POST", "/api/board/week", { week, rev: doc.rev });
    if (status === 409) { doc = data.doc; render(); return; }   // changed on a phone meanwhile: show that
    doc = data;
    seen = null;
    scheduleRedraw();
  }).catch(() => {});
}
function scheduleRedraw() {
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(redraw, REDRAW_AFTER_MS);
}
async function redraw() {
  if (dragging) return scheduleRedraw();
  try {
    if (!fb) ({ fb, days: frames.days } = (await api("GET", "/api/board")).data);
    if (!PB.staleGroups(doc, fb, frames, ["days"]).length) return;
    frames = await PB.syncScreens(doc, fb, frames, ["days"], { headers: { "X-Board-Key": key }, progress: (pct) => ($("saving").textContent = `Updating the big screen ${pct}%`) });
  } catch (e) { scheduleRedraw(); }
  $("saving").textContent = "";
}

/* ---------- keeping up: other phones, the clock, bedtime ---------- */
// Only the touchscreen Pi goes dark at night (its link carries kiosk=1). On a
// Chromebook or phone the board stays usable, so the week can be set up at
// night and be on her big screen in the morning.
const KIOSK = new URLSearchParams(location.hash.slice(1)).get("kiosk") === "1";
function isNight() {
  if (!doc || !KIOSK) return false;
  const now = new Date(), hm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const { on = "08:00", off = "20:00", board = "same" } = doc.screen || {};
  if (board !== "same") return board === "off";
  if (on === off) return false;
  return on < off ? !(hm >= on && hm < off) : !(hm >= on || hm < off);
}
async function refresh() {
  try {
    const v = await (await fetch("/api/version", { cache: "no-store" })).json();
    if (seen && v.boot !== seen.boot) return location.reload();
    if (!seen || v.rev !== seen.rev) {
      if (dragging) return;
      doc = await (await fetch("/api/contacts", { cache: "no-store" })).json();
      seen = v;
      render();
    }
  } catch (e) { /* the Pi is restarting: try again soon */ }
}
setInterval(() => {
  $("night").classList.toggle("on", isNight());
  if (!dragging && Date.now() - touched > IDLE_MS && day !== PB.weekdayOf(new Date())) { day = PB.weekdayOf(new Date()); render(); }
}, 5000);
setInterval(refresh, 10000);
setInterval(() => { if (!dragging) render(); }, 60000);   // "now" moves through the day

(async () => {
  if (!key) return message("This board needs its link.\nOn the admin page: Settings → Magnet board.");
  try {
    ({ fb, days: frames.days } = (await api("GET", "/api/board")).data);
    await refresh();
    $("night").classList.toggle("on", isNight());
    redraw();
  } catch (e) { /* message already shown */ }
})();
</script>
<!-- Tinny pops in from the corner when the record player starts something (tablet only). -->
<style>
.tinnyPop { position: fixed; right: 2.5vmin; bottom: 2vmin; z-index: 60; display: flex; align-items: flex-end; gap: 1.5vmin;
  transform: translateX(130%); transition: transform .45s cubic-bezier(.2, 1.3, .4, 1); cursor: pointer; font-family: "Andika", sans-serif; }
.tinnyPop.on { transform: translateX(0); }
.tinnyPop .tpSay { background: #fff; color: #16181f; border: .7vmin solid #16181f; border-radius: 3vmin; padding: 1.6vmin 2.4vmin; margin-bottom: 14vmin;
  font: 700 3.6vmin/1.15 "Andika", sans-serif; max-width: 34vmin; box-shadow: 0 .8vmin 0 #16181f; }
.tinnyPop .tpSay small { display: block; font-size: 2.6vmin; color: #5b6170; margin-top: .6vmin; }
.tinnyPop .tpMe { position: relative; width: 20vmin; }
.tinnyPop canvas { display: block; width: 20vmin; height: auto; image-rendering: pixelated; margin-top: 12.5vmin; }
.tinnyPop .tpCover { position: absolute; left: 3vmin; top: 0; width: 14vmin; height: 14vmin; border-radius: 1.4vmin; background: #2a2d3a center/cover no-repeat;
  border: .7vmin solid #16181f; animation: tpBob .6s ease-in-out infinite alternate; display: grid; place-items: center; font-size: 6vmin; }
.tinnyPop .tpCover.look { background: #fff; animation: tpLook 1.2s ease-in-out infinite; }
@keyframes tpBob { to { transform: translateY(-1vmin) rotate(-3deg); } }
@keyframes tpLook { 50% { transform: rotate(6deg); } }
</style>
<div class="tinnyPop" id="tinnyPop" role="button" aria-label="Go see Tinny">
  <div class="tpSay" id="tpSay"></div>
  <div class="tpMe"><div class="tpCover" id="tpCover"></div><canvas id="tpPet" width="26" height="28"></canvas></div>
</div>
<script>
// While she's on her board or the home screen, the record player still shows: Tinny slides in from the
// corner with the cover and slides back out. Tapping Tinny goes to the full scene in Tinny.
(() => {
  if (!window.tinnyPopGo) return;                     // only on the tablet (the page sets where a tap goes)
  const RECORD = "http://192.168.68.144:8080";
  const pop = document.getElementById("tinnyPop"), say = document.getElementById("tpSay"), cover = document.getElementById("tpCover");
  const c = document.getElementById("tpPet").getContext("2d");
  const COL = { k: "#16181f", g: "#b9c0cc", l: "#e4e8ef", d: "#8b93a3", p: "#f2a1a8", m: "#e9ad1c" };
  const px = (x, y, col, w = 1, h = 1) => { c.fillStyle = COL[col]; c.fillRect(x, y, w, h); };
  let tick = 0;
  function draw() {                                   // Tinny with both arms up, holding the cover over its head
    c.clearRect(0, 0, 26, 28);
    const top = 5, bot = 24, ey = top + 7, my = ey + 4;
    px(5, top, "k", 16, 1); px(4, top + 1, "k", 1, bot - top - 1); px(21, top + 1, "k", 1, bot - top - 1); px(5, bot, "k", 16, 1);
    px(5, top + 1, "g", 16, bot - top - 1); px(5, top + 1, "l", 16, 2); px(5, top + 3, "d", 16, 1); px(5, bot - 3, "d", 16, 1);
    px(6, top + 5, "l", 1, bot - top - 9); px(7, top + 5, "l", 1, 2);
    px(8, ey + 1, "k"); px(9, ey, "k"); px(10, ey + 1, "k"); px(15, ey + 1, "k"); px(16, ey, "k"); px(17, ey + 1, "k");
    px(7, ey + 3, "p", 2, 1); px(17, ey + 3, "p", 2, 1);
    if (tick % 6 < 3) { px(12, my, "k", 3, 1); px(12, my + 1, "#e2413b", 3, 1); px(11, my, "k", 1, 2); px(15, my, "k", 1, 2); }
    else { px(11, my, "k"); px(12, my + 1, "k", 3, 1); px(15, my, "k"); }
    px(2, top - 4, "k", 2, 8); px(22, top - 4, "k", 2, 8);   // arms up
    px(7, bot + 1, "k", 4, 2); px(15, bot + 1, "k", 4, 2);
  }
  setInterval(() => { tick++; if (pop.classList.contains("on")) draw(); }, 300);
  draw();

  let last = "", hideAt = 0;
  function show(m) {
    if (m.state === "playing") {
      cover.className = "tpCover"; cover.textContent = m.art ? "" : "🎵";
      cover.style.backgroundImage = m.art ? `url("${m.art}")` : "";
      say.innerHTML = ""; say.append(m.song ? "♪ " + m.song : (m.name || "A song!"));
      const s = document.createElement("small"); s.textContent = "Tap to dance with Tinny!"; say.append(s);
      hideAt = Date.now() + 10000;
    } else {
      cover.className = "tpCover look"; cover.style.backgroundImage = ""; cover.textContent = "🔍";
      say.textContent = "Ooh, a card! Let me look…";
      hideAt = Date.now() + 25000;
    }
    pop.classList.add("on");
  }
  async function poll() {
    try {
      const m = await (await fetch(RECORD + "/now.json", { cache: "no-store" })).json();
      const key = m.state === "playing" ? "play:" + (m.name || "") : m.state === "reading" ? "read" : "";
      if (key && key !== last) show(m);
      if (!key && last === "read") hideAt = Math.min(hideAt, Date.now() + 1500);   // read, nothing to play
      last = key;
    } catch (e) {}
    if (Date.now() > hideAt) pop.classList.remove("on");
  }
  pop.addEventListener("click", () => { location.href = window.tinnyPopGo ? window.tinnyPopGo() : "/tinny"; });
  setInterval(poll, 1500); poll();
})();
</script>

</body>
</html>
